// Package guest.v1 is the k3sm VM-pod guest contract: everything that crosses
// the host↔guest boundary for a `vm`-backend pod. It carries all three parts of
// that boundary in ONE home — the GuestAgent vsock gRPC service, the GuestSpec
// the guest init reads at boot, and the VMHostSpec the per-pod VM host process
// reads to build the machine — because they describe one boundary and splitting
// them across packages would only add import paths (there is deliberately no
// k3sm.io/apis/vm/v1).
//
// WHY THIS IS A VERSIONED WIRE CONTRACT even though both ends are built from
// k3sm.io/runtimed: the guest end ships inside the INITRAMFS, an independently
// released, sha256-pinned artifact acquired at install time — not a symbol
// linked into the daemon. A node can therefore run a daemon and an initramfs
// that were not built together, so the boundary is a wire contract in fact and
// is treated as one here.
//
// COMPAT POSTURE: compat is LOCKSTEP via the in-code initramfs sha256 pin. The
// supported configuration is exactly the daemon paired with the initramfs its
// own pin names; `--guest-artifacts-dir` (the dev-lab override) is UNSUPPORTED
// SKEW. Because "unsupported" must still be legible rather than silent stream
// corruption, GuestAgent.Health carries api_version + capabilities: a host that
// dials an agent speaking a different api_version rejects the pod with a stated
// reason instead of proceeding.
//
// Stability contract: as in runtime.proto — field numbers are STABLE and the
// surface is ADDITIVE-ONLY forever. Never renumber or repurpose a field; never
// reuse a reserved number/name. Every message keeps the file convention's
// `reserved 100 to 149;` headroom band. `buf breaking` (WIRE_JSON) enforces it
// against buf/baseline.binpb.
syntax = "proto3";

package k3sm.guest.v1;

import "google/protobuf/timestamp.proto";
// runtime/v1 is imported so Exec and Logs can NAME the existing
// k3sm.runtime.v1 stream messages rather than declare parallel copies of them —
// the guest verbs are the same verbs, one hop further in. A proto file import
// is not a Go module dependency: both packages are in k3sm.io/apis.
import "runtime/v1/runtime.proto";

option go_package = "k3sm.io/apis/guest/v1;guestv1";

// GuestAgent is the in-guest agent (PID 1 of the micro-VM, shipped in the
// pinned initramfs). It is served over VSOCK on GuestSpec.agent_port and dialed
// by the per-pod VM host process, which proxies it to a runtimed-PRIVATE unix
// socket — never a path inside the pod dir, and never reachable from the pod
// itself.
//
// SINGLE-POD GUEST. One VM hosts exactly one pod, so every RPC below is scoped
// to that pod implicitly. Requests still carry pod_id, and the agent MUST
// reject a pod_id that is not the pod it booted: the id is an assertion the
// caller reached the guest it meant to reach, not a selector over several.
// `container` is the real selector within the pod.
//
// TRUST: everything the agent returns is GUEST-CONTROLLED DATA. The guest runs
// the workload, so a compromised workload can shape these responses. The host
// reads them with bounded reads and lets them affect nothing beyond that one
// pod's own status.
//
// RPC numbering note: gRPC method names (not numbers) are the wire identity, so
// there is no numeric range to reserve. This service is APPEND-ONLY — do not
// remove or rename a method.
service GuestAgent {
  // Health reports guest readiness, the DHCP-leased guest address, whether
  // Rosetta binfmt registration succeeded, and the agent's api_version /
  // capabilities. It is the pod's boot-deadline probe AND the single authority
  // on the guest's live address — the host does not re-derive the address from
  // the network attachment.
  rpc Health(HealthRequest) returns (HealthResponse);

  // ContainerEvents streams container lifecycle transitions (started / exited)
  // for the booted pod. It is the ONLY source of OOM truth for a vm pod: the
  // kill happens in the guest's cgroup, so the host's rusage sampler can never
  // observe it and must never synthesize it.
  rpc ContainerEvents(ContainerEventsRequest) returns (stream ContainerEvent);

  // Exec runs `kubectl exec` inside a guest container, reusing the runtime/v1
  // exec stream messages verbatim. In ExecRequest, pod_id MUST equal the pod
  // this guest booted (the agent rejects any other) and container selects
  // within it; the remaining fields keep their runtime/v1 meaning exactly.
  rpc Exec(stream k3sm.runtime.v1.ExecRequest) returns (stream k3sm.runtime.v1.ExecResponse);

  // Logs streams a guest container's output, reusing the runtime/v1 log stream
  // messages verbatim. In GetLogsRequest, pod_id MUST equal the pod this guest
  // booted and container selects within it; follow / tail_lines / since_time /
  // timestamps / previous / limit_bytes keep their runtime/v1 meaning.
  rpc Logs(k3sm.runtime.v1.GetLogsRequest) returns (stream k3sm.runtime.v1.LogEntry);

  // Stats returns a per-container resource sample read from the guest's cgroup2
  // hierarchy. It is answered ON DEMAND — the host asks when it needs a sample
  // and never runs a sampling ticker against a guest, because the vm path has
  // no OOM race to poll for (the hypervisor memory ceiling is enforced by the
  // VM, and OOM arrives as a ContainerEvent).
  rpc Stats(StatsRequest) returns (StatsResponse);

  // Stop begins guest shutdown: SIGTERM to every container, then SIGKILL to
  // whatever is left after grace_seconds, then filesystem sync and poweroff.
  // The caller's grace budget must fit inside the daemon's own launchd exit
  // timeout; a larger grace is clamped by the host before it is sent.
  rpc Stop(StopRequest) returns (StopResponse);
}

// ---------------------------------------------------------------------------
// GuestAgent request/response messages.
// ---------------------------------------------------------------------------

// HealthRequest is empty (the guest hosts exactly one pod, so there is nothing
// to select). Reserved for future filters.
message HealthRequest {}

// HealthResponse is the guest's readiness + identity report.
message HealthResponse {
  // ready is true once the boot sequence has completed far enough to accept the
  // other RPCs (filesystems mounted, spec read, network configured).
  bool ready = 1;

  // guest_ip is the address the guest's DHCP client leased on eth0, in dotted
  // form; empty until the lease is held. THIS FIELD IS THE SINGLE LIVE-ADDRESS
  // AUTHORITY for a vm pod: the pod's status IP is what the agent reports here,
  // never a value the host inferred from the network attachment. A lease change
  // is therefore observable as a change in this field.
  string guest_ip = 2;

  // rosetta_registered is true when the guest completed Rosetta binfmt_misc
  // registration, so linux/amd64 payloads in this pod will execute. It is
  // false — not an error — on a guest that was booted without Rosetta.
  bool rosetta_registered = 3;

  // api_version is the guest/v1 contract version this agent speaks. Compat is
  // lockstep via the initramfs sha256 pin, so a mismatch means the operator is
  // running unsupported skew (a dev-lab --guest-artifacts-dir pairing): the
  // host MUST fail the pod with that stated reason rather than continue and
  // discover the mismatch as malformed streams.
  string api_version = 4;

  // capabilities are optional feature tokens the agent advertises. It exists so
  // a capability can be negotiated WITHOUT an api_version bump for changes that
  // are genuinely additive; an unknown token is ignored by the host.
  repeated string capabilities = 5;

  reserved 100 to 149;
}

// ContainerEventsRequest subscribes to the booted pod's lifecycle stream.
message ContainerEventsRequest {
  // pod_id must equal the pod this guest booted; the agent rejects any other.
  string pod_id = 1;

  reserved 100 to 149;
}

// ContainerEvent is one container lifecycle transition. Exactly one of started
// or exited is set — the optional-message union, matching the runtime/v1
// ContainerState precedent rather than a oneof.
message ContainerEvent {
  // container is the container name within the pod.
  string container = 1;

  // timestamp is when the guest observed the transition.
  google.protobuf.Timestamp timestamp = 2;

  // started and exited are the event union: exactly one is set.
  ContainerStarted started = 3;
  ContainerExited exited = 4;

  reserved 100 to 149;
}

// ContainerStarted reports that a container's process was spawned in the guest.
message ContainerStarted {
  // pid is the process id INSIDE the guest, useful only for guest-side
  // correlation — it means nothing to the host process table.
  int32 pid = 1;

  reserved 100 to 149;
}

// ContainerExited reports a container's terminal outcome.
message ContainerExited {
  // exit_code is the process exit status (0..255) when it exited normally.
  int32 exit_code = 1;

  // signal is the terminating signal number when the process was killed, else
  // 0. It is the guest's signal number, so it is Linux's numbering.
  int32 signal = 2;

  // oom_killed is true when the guest kernel's cgroup OOM killer ended the
  // process. This is the ONLY way a vm pod is ever marked OOMKilled: the host
  // cannot see a guest cgroup event, so it never derives OOMKilled from its own
  // sampling for a vm pod.
  bool oom_killed = 3;

  reserved 100 to 149;
}

// StatsRequest asks for a resource sample of the booted pod.
message StatsRequest {
  // pod_id must equal the pod this guest booted; the agent rejects any other.
  string pod_id = 1;

  reserved 100 to 149;
}

// StatsResponse carries one on-demand sample per container.
message StatsResponse {
  // timestamp is when the guest took the sample.
  google.protobuf.Timestamp timestamp = 1;

  // containers are the per-container samples, one per running container. A
  // container the agent could not read is OMITTED rather than reported as
  // zeros: a zero sample is indistinguishable from an idle container, so
  // absence is the only honest encoding of "unknown".
  repeated GuestContainerStats containers = 2;

  reserved 100 to 149;
}

// GuestContainerStats is one container's cgroup2 sample. It is deliberately NOT
// the runtime/v1 ContainerStats: those fields are sourced from Darwin
// proc_pid_rusage and carry that provenance in their names and semantics, while
// these two come from the guest's cgroup2 files. The host maps these onto the
// kubelet Summary shape at the boundary, so a reader can always tell which
// kernel produced a number.
message GuestContainerStats {
  // container is the container name within the pod.
  string container = 1;

  // cpu_usage_usec is cumulative CPU time in MICROSECONDS, read from the
  // cgroup2 cpu.stat `usage_usec` counter.
  uint64 cpu_usage_usec = 2;

  // memory_working_set_bytes is the working set, computed as
  // memory.current − memory.stat inactive_file — the cgroup2 definition kubelet
  // uses, not memory.current alone (page cache would otherwise be charged as
  // live memory).
  uint64 memory_working_set_bytes = 3;

  reserved 100 to 149;
}

// StopRequest asks the guest to shut down.
message StopRequest {
  // grace_seconds is the budget for graceful termination before SIGKILL. The
  // host clamps it to fit inside the daemon's launchd exit timeout before
  // sending, so the guest can treat it as already-budgeted.
  int32 grace_seconds = 1;

  reserved 100 to 149;
}

// StopResponse is empty: shutdown is acknowledged by the call returning, and
// the guest powers off immediately after. Reserved for future detail.
message StopResponse {
  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// GuestSpec — the boot contract. `guest-spec.json` IS the proto-JSON encoding
// of this message; the guest init reads that file as its first act after
// mounting the pseudo-filesystems.
// ---------------------------------------------------------------------------

// GuestSpec is everything the guest init needs to realize one pod. It is
// produced host-side (all Kubernetes-level resolution — env, image config
// merge, user resolution inputs — has already happened) and consumed by the
// guest exactly as given.
message GuestSpec {
  // hostname is the pod hostname set in the guest and bound into every
  // container's /etc/hostname.
  string hostname = 1;

  // resolv_conf is the DNS configuration bound into every container's
  // /etc/resolv.conf. It is carried STRUCTURED rather than as rendered file
  // bytes so the guest can render it musl-safely (alpine's resolver ignores
  // `options ndots`, so the search list must not depend on it).
  ResolvConf resolv_conf = 2;

  // containers are the pod's containers in start order: init containers (init
  // = true) first and sequentially, then the main containers.
  repeated GuestContainer containers = 3;

  // mounts are the pod-level mounts the guest sets up before any container
  // starts (virtiofs shares, tmpfs, binds).
  repeated GuestMount mounts = 4;

  // rosetta is true when the VM was created with the Rosetta share attached, so
  // the guest should register the linux/amd64 binfmt_misc interpreter.
  bool rosetta = 5;

  // fs_group is the pod's fsGroup, applied via idmapped mounts (never a
  // recursive chown). 0 means unset.
  int64 fs_group = 6;

  // agent_port is the VSOCK port the agent listens on. It MUST equal
  // VMHostSpec.agent_vsock_port — the two specs are written by the same host
  // and a disagreement makes the guest unreachable.
  uint32 agent_port = 7;

  reserved 100 to 149;
}

// ResolvConf is the guest's DNS configuration, rendered into
// /etc/resolv.conf by the guest init. Mirrors the three resolv.conf directives
// k3sm sets; ordering within each list is significant and preserved.
message ResolvConf {
  // nameservers are resolver addresses in query order.
  repeated string nameservers = 1;
  // searches is the search list, in order.
  repeated string searches = 2;
  // options are resolver options (e.g. "ndots:5"). A musl guest ignores some of
  // these, which is why the search list must stand on its own.
  repeated string options = 3;

  reserved 100 to 149;
}

// GuestContainer is one container to run inside the guest.
message GuestContainer {
  // name is the container name, unique within the pod. It is the selector
  // Exec / Logs / Stats and ContainerEvent use.
  string name = 1;

  // rootfs_tag names the virtiofs share carrying this container's rootfs lower
  // layer. The guest composes writability as an overlay (that share is
  // read-only at the VZ device); the tag is the only rootfs identity that
  // crosses the boundary — no host path does.
  string rootfs_tag = 2;

  // command and args form argv: argv = command + args. They are ALREADY MERGED
  // host-side against the image config (Entrypoint/Cmd) per the Kubernetes
  // four-quadrant rule — the guest performs no further merge and consults no
  // image config of its own.
  repeated string command = 3;
  repeated string args = 4;

  // env are fully resolved "KEY=VALUE" entries. Every Kubernetes indirection
  // (valueFrom, envFrom, $(VAR) expansion) is resolved host-side, so the guest
  // needs no cluster access to start a container.
  repeated string env = 5;

  // working_dir is the process working directory inside the container rootfs;
  // empty means the image config's WorkingDir as already merged host-side.
  string working_dir = 6;

  // tty requests a pseudo-terminal for the container's process.
  bool tty = 7;

  // stdin keeps stdin open for the container's process.
  bool stdin = 8;

  // uid and gid are the resolved numeric ids the process runs as. Resolution of
  // a non-numeric image USER against the rootfs's /etc/passwd happens IN THE
  // GUEST at execution time (the host does not read a pod-controlled passwd
  // file); when the host already knows the numeric answer it stamps it here.
  int64 uid = 9;
  int64 gid = 10;

  // supplemental_gids are the additional groups, including the pod fsGroup.
  repeated int64 supplemental_gids = 11;

  // init marks an init container: it runs to completion, in list order, before
  // any main container starts.
  bool init = 12;

  reserved 100 to 149;
}

// GuestMountKind is how a GuestMount is realized in the guest.
enum GuestMountKind {
  GUEST_MOUNT_KIND_UNSPECIFIED = 0;
  // VIRTIOFS mounts a host-attached virtiofs share, selected by its device tag.
  GUEST_MOUNT_KIND_VIRTIOFS = 1;
  // TMPFS mounts guest RAM (an emptyDir with medium Memory, and the writable
  // upper of a rootfs overlay). It never crosses virtiofs.
  GUEST_MOUNT_KIND_TMPFS = 2;
  // BIND re-exposes an already-mounted guest path at a second target, which is
  // how per-container /etc files and per-container subpaths are composed.
  GUEST_MOUNT_KIND_BIND = 3;
}

// GuestMount is one mount the guest init performs.
message GuestMount {
  // tag_or_source is the virtiofs device TAG for VIRTIOFS, the source path for
  // BIND, and empty for TMPFS. It is never a host path: the host path a share
  // was built from stays in VMHostSpec and never enters the guest.
  string tag_or_source = 1;

  // target is the absolute mount point inside the guest.
  string target = 2;

  // kind selects how the mount is realized.
  GuestMountKind kind = 3;

  // read_only mounts without write access. For a virtiofs share this MIRRORS a
  // read-only setting already applied at the VZ device — the guest-side flag is
  // defence in depth, never the only enforcement.
  bool read_only = 4;

  // size_limit_bytes bounds a TMPFS mount; 0 means unbounded. Bounding the
  // overlay upper matters: an unbounded upper turns a runaway write into a
  // guest OOM that is then misattributed to the workload's memory use, while a
  // bounded one fails as ENOSPC where it happened.
  int64 size_limit_bytes = 5;

  // idmap requests an idmapped mount (Linux MOUNT_ATTR_IDMAP) so files owned by
  // the host-side owner appear as the container's effective uid/fsGroup. This
  // is how fsGroup is honored with ZERO recursive chown on either side.
  bool idmap = 6;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// VMHostSpec — the machine contract. `vmhost.spec.json` IS the proto-JSON
// encoding of this message; the per-pod VM host process reads that file and
// builds the virtual machine from it, and does nothing else policy-shaped.
// ---------------------------------------------------------------------------

// VMHostSpec is the whole description of one pod's virtual machine. It is
// deliberately mechanical: every policy decision (which platform, which shares,
// how much memory) is already made by the time this is written, so the VM host
// process is a translator and never a decision-maker.
message VMHostSpec {
  // pod_id is the kube Pod UID this VM hosts. It also seeds the deterministic
  // locally-administered MAC when mac_address is empty.
  string pod_id = 1;

  // vcpus is the virtual CPU count.
  uint32 vcpus = 2;

  // memory_bytes is the guest RAM size. It is the HYPERVISOR-ENFORCED ceiling
  // for the pod, which is why the vm path needs no host-side memory sampling to
  // enforce a limit.
  int64 memory_bytes = 3;

  // kernel_path and initramfs_path are host paths to the pinned guest
  // artifacts. Their sha256 digests are pinned IN CODE and verified before use;
  // these fields carry only where the verified artifacts live.
  string kernel_path = 4;
  string initramfs_path = 5;

  // cmdline is the kernel command line.
  string cmdline = 6;

  // shares are the virtiofs devices attached to the machine.
  repeated VMShare shares = 7;

  // rosetta attaches the Rosetta share so the guest can register the
  // linux/amd64 interpreter. It must agree with GuestSpec.rosetta.
  bool rosetta = 8;

  // agent_vsock_port is the VSOCK port the host dials to reach the guest agent.
  // It MUST equal GuestSpec.agent_port.
  uint32 agent_vsock_port = 9;

  // mac_address is the guest NIC's MAC. Empty means derive it deterministically
  // from pod_id, which is what keeps a DHCP lease stable across a VM restart of
  // the same pod.
  string mac_address = 10;

  reserved 100 to 149;
}

// VMShare is one virtiofs device attached to the machine.
message VMShare {
  // tag is the device tag the guest mounts by. It is the ONLY name the guest
  // learns; host_path never crosses the boundary.
  string tag = 1;

  // host_path is the host directory exported by this share. Every share root
  // lives inside the owning pod's own directory tree (or a bound claim's
  // configured data dir), and the set is pairwise disjoint — no share is an
  // ancestor of another.
  string host_path = 2;

  // read_only exports the share without write access AT THE VZ DEVICE, which is
  // the enforcement point. A guest-side read_only flag mirrors it but cannot
  // substitute for it.
  bool read_only = 3;

  reserved 100 to 149;
}
