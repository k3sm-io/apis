# INTERIM public CI (M7 bootstrap).
#
# Runs the repo's existing hack/ci.sh gate on every PR, plus a -race pass, plus
# the PINNED buf toolchain so hack/ci.sh's wire-stability checks (lint /
# generate-diff / breaking, guarded behind `command -v buf`) actually run instead
# of silently self-skipping.
#
# This is superseded later by the full M7.2 gate (actionlint/zizmor +
# workflow-manifest + symbol-canary liveness), which subsumes it.
#
# Read-only token; pull_request trigger (never pull_request_target); GitHub-hosted
# ephemeral Apple-Silicon runner; third-party actions pinned by commit SHA.
name: CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: go.mod
      - name: buf toolchain
        # Install the PINNED codegen toolchain (same versions as hack/gen.sh) so
        # hack/ci.sh's buf block runs rather than self-skipping. Keep in lockstep
        # with hack/gen.sh: BUF_VERSION / PROTOC_GEN_GO_VERSION / PROTOC_GEN_GO_GRPC_VERSION.
        run: |
          set -euo pipefail
          go install github.com/bufbuild/buf/cmd/buf@v1.71.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: gate
        run: hack/ci.sh
      - name: race
        # The race detector requires cgo; apis's normal posture is CGO=0, but the
        # race pass needs cgo. macos-15 ships the Xcode command-line tools.
        run: CGO_ENABLED=1 go test -race ./...
