version: v2
modules:
  - path: .
deps:
  # Supplies google/rpc/status.proto (the structured Create/Delete error model).
  # Imports resolve to the existing google.golang.org/genproto/googleapis/rpc Go
  # package (already pulled in transitively by grpc) — buf generate does NOT emit
  # a copy. google/protobuf/* well-known types are bundled with buf itself.
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # The package is k3sm.runtime.v1 but the dir is runtime/v1 (go_package
    # k3sm.io/apis/runtime/v1) — the repo is already namespaced as k3sm.io/apis,
    # so a leading k3sm/ dir would stutter.
    - PACKAGE_DIRECTORY_MATCH
    # Contract names are fixed by the original design: `service Runtime` (not
    # RuntimeService); the watch/logs streams carry domain types PodStatusEvent
    # and LogEntry (not WatchPodStatusResponse / GetLogsResponse). The same
    # exemption covers `service Images` (not ImageService) in images.proto — the
    # CRI-style second service in this one package keeps the sibling's naming.
    - SERVICE_SUFFIX
    - RPC_RESPONSE_STANDARD_NAME
  ignore_only:
    # guest/v1's GuestAgent Exec/Logs/Attach REUSE the k3sm.runtime.v1 stream messages
    # verbatim (ExecRequest/ExecResponse, GetLogsRequest/LogEntry): the guest
    # verbs are the same verbs one hop further in, so declaring parallel copies
    # is exactly the duplication this shared-contracts module exists to prevent
    # — and two shapes for one stream would drift. That reuse makes those
    # messages serve two RPCs each, which trips the uniqueness rule on BOTH the
    # reusing file and the file that declared them. Scoped to those two paths,
    # so any other service still gets the rule.
    RPC_REQUEST_RESPONSE_UNIQUE:
      - guest/v1/guest.proto
      - runtime/v1/runtime.proto
    # Same reuse, second consequence: GuestAgent.Logs takes the reused
    # GetLogsRequest, whose name follows runtime/v1's GetLogs verb rather than
    # this service's Logs verb. Renaming the RPC to satisfy the linter would
    # rename a contract verb to suit a message it deliberately does not own.
    RPC_REQUEST_STANDARD_NAME:
      - guest/v1/guest.proto
breaking:
  use:
    - WIRE_JSON # additive-only: no field renumber, no wire/JSON-incompatible change
  except:
    # The per-message 100..199 (PodBox) / 100..149 (sibling) ranges are
    # DOCUMENTED consumable headroom (see docs/PHASES.md): resource +
    # metrics fields land there so they never collide with the sub-100
    # sequential original fields. Narrowing a reserved MESSAGE range to allocate a
    # field within it is therefore BY DESIGN, not a wire break — converting
    # never-used reserved headroom into a field is wire- and JSON-safe. Every
    # field-level guard stays ON (FIELD_NO_DELETE, FIELD_SAME_TYPE / _NAME /
    # _JSON_NAME, FIELD_NO_DELETE_UNLESS_NUMBER_RESERVED) plus
    # RESERVED_ENUM_NO_DELETE, so no existing field can be renumbered, retyped,
    # or deleted vs buf/baseline.binpb. No reserved range in this proto stems
    # from a DELETED field (all are headroom), so this except removes no real
    # wire protection.
    - RESERVED_MESSAGE_NO_DELETE
