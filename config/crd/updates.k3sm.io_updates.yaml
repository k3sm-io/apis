# Update CRD (updates.k3sm.io/v1alpha1): one request to move every node of
# the cluster to one k3sm release.
#
# Hand-authored (apis runs no controller-gen) to match the Go type in
# k3sm.io/apis/updates/v1alpha1 (update.go). ALPHA: a SINGLE version v1alpha1
# is both served and stored, and its shape may change incompatibly until it
# graduates.
#
# Scope is Cluster: a cluster runs one release. The update controller
# reconciles only the Update named "current" and ignores any other name (the
# schema cannot see other objects). spec.version is immutable and spec.cancel
# is one-way, both as CEL transition rules. The phases are display only and
# carry no closed enum; conditions are the source of truth. The controller
# writes status through the status subresource.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: updates.updates.k3sm.io
spec:
  group: updates.k3sm.io
  scope: Cluster
  names:
    kind: Update
    listKind: UpdateList
    plural: updates
    singular: update
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Phase
          type: string
          jsonPath: .status.phase
          description: Display only, derived from conditions; readers tolerate values they do not know.
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: Update is one request to move every node of the cluster to the release spec.version (spec, set by an admin) and the progress of that roll (status, written by the update controller).
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - version
              properties:
                version:
                  type: string
                  description: Version is the release tag to install on every node (for example v0.2.0).
                  minLength: 1
                  maxLength: 128
                  pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: spec.version is immutable after create
                strategy:
                  type: object
                  description: Strategy is how the roll proceeds across the nodes.
                  default: {}
                  properties:
                    order:
                      type: string
                      description: Order is the node order; workers-then-server updates every worker before the server.
                      default: workers-then-server
                      enum:
                        - workers-then-server
                    maxUnavailable:
                      type: integer
                      format: int32
                      description: MaxUnavailable is the most nodes updated at once; the server is always updated alone.
                      default: 1
                      minimum: 1
                    drain:
                      type: boolean
                      description: Drain evicts each node's pods after cordoning it and before restarting it; false only cordons.
                      default: false
                verify:
                  type: object
                  description: Verify is what the downloaded release must prove before it is installed, beyond its checksum, which is always verified against the release's published checksums.
                  default: {}
                  properties:
                    signature:
                      type: string
                      description: "Signature is the code-signature policy for the payload's Mach-Os. if-signed (the default) matches the installed build: an installed build that carries a Developer ID team signature requires the payload's Mach-Os to carry the same team's signature, and an ad-hoc signed installed build accepts an ad-hoc signed payload. required refuses any payload without a team signature, whatever the installed build carries."
                      default: if-signed
                      enum:
                        - if-signed
                        - required
                allowDowngrade:
                  type: boolean
                  description: AllowDowngrade permits a version older than the release a node runs.
                  default: false
                cancel:
                  type: boolean
                  description: Cancel stops the roll before the next node; nodes already moved stay on the new release. One-way, it cannot be set back to false.
                  default: false
                  x-kubernetes-validations:
                    - rule: '!oldSelf || self'
                      message: spec.cancel cannot be set back to false
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: Phase is the overall state of the update. Display only, derived from conditions; readers tolerate values they do not know.
                  maxLength: 64
                resolved:
                  type: object
                  description: Resolved is the release that was verified.
                  properties:
                    version:
                      type: string
                      description: Version is the release tag that was resolved.
                      maxLength: 128
                    digest:
                      type: string
                      description: Digest is the digest of the verified payload, in the algorithm:hex form.
                      maxLength: 256
                nodes:
                  type: array
                  description: Nodes is the progress of each node, one entry per node name.
                  maxItems: 64
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: Name is the node name.
                        minLength: 1
                        maxLength: 253
                      from:
                        type: string
                        description: From is the release the node ran when the update reached it.
                      to:
                        type: string
                        description: To is the release the node is moving to.
                      phase:
                        type: string
                        description: Phase is the step the node is on. Display only, derived from conditions; readers tolerate values they do not know.
                        maxLength: 64
                      message:
                        type: string
                        description: Message is a human-readable detail of the current step, or the reason it failed.
                        maxLength: 32768
                      adminTokenRotated:
                        type: boolean
                        description: AdminTokenRotated is set when the node's in-place install could not keep the installed admin token and minted a new one, so every kubeconfig copied from this control plane before the update is now refused. The remedy is to copy the admin kubeconfig again. Never set on a worker.
                      startedAt:
                        type: string
                        format: date-time
                        description: StartedAt is when the node left Pending.
                      finishedAt:
                        type: string
                        format: date-time
                        description: FinishedAt is when the node reached Done or Failed.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - name
                conditions:
                  type: array
                  description: Conditions are the standard Kubernetes conditions for the update, the source of truth the phases are derived from.
                  maxItems: 16
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                    properties:
                      type:
                        type: string
                        maxLength: 316
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                        maxLength: 1024
                      message:
                        type: string
                        maxLength: 32768
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                observedGeneration:
                  type: integer
                  format: int64
                  description: ObservedGeneration is the metadata.generation this status was computed from.
                  minimum: 0
