# KeyDelivery CRD (keystore.k3sm.io/v1alpha1): a namespaced declaration that
# delivers one user-scope keystore entry into its namespace as a Secret.
#
# Hand-authored (apis runs no controller-gen) to match the Go type in
# k3sm.io/apis/keystore/v1alpha1 (keydelivery.go). ALPHA: a SINGLE version
# v1alpha1 is both served and stored; its shape may change, and a conversion
# is owed if it does.
#
# Every spec field is required and immutable through a CEL transition rule
# (self == oldSelf; spec.items compares as a map, so a reorder is not a
# change): a transition rule does not run when the old value is absent, so an
# optional field could be set later to anything. spec.items has no default:
# the apiserver cannot see the entry's kind. Its field enum is the union of
# the k3sm.io/apis/keystore/credential field table, which holds no refresh
# field; a parity test holds this file to that table.
# The entry pattern, its maxLength and the entry CEL rules are the grammar of
# k3sm.io/apis/keystore/entry, defined there once; a parity test holds this
# file to it. The status subresource is on; the conditions are the source of
# truth and the closed reason set is listed in their description. The schema
# checks shape and immutability only: it is not the authority.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: keydeliveries.keystore.k3sm.io
spec:
  group: keystore.k3sm.io
  scope: Namespaced
  names:
    kind: KeyDelivery
    listKind: KeyDeliveryList
    plural: keydeliveries
    singular: keydelivery
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Entry
          type: string
          jsonPath: .spec.entry
        - name: Secret
          type: string
          jsonPath: .spec.secretName
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Valid
          type: string
          jsonPath: .status.conditions[?(@.type=="CredentialValid")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: KeyDelivery declares that one user-scope keystore entry is delivered into this namespace as a Secret. Alpha.
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: Spec is the declaration. Every field is required, and immutable after create.
              required:
                - entry
                - secretName
                - items
                - requestedBy
              x-kubernetes-validations:
                - rule: "!self.entry.startsWith('user/') || self.requestedBy == 'k3sm:local:' + self.entry.split('/')[1]"
                  message: spec.requestedBy must be k3sm:local:<uid> for the entry's own uid
              properties:
                entry:
                  type: string
                  description: Entry is the scope-qualified entry, user/<uid>/<name>, with a decimal uid from 1 to 4294967295 and no leading zero. A system entry is refused. Immutable.
                  maxLength: 269
                  pattern: '^(system|user/[1-9][0-9]{0,9})/[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: spec.entry is immutable after create
                    - rule: "!self.startsWith('user/') || int(self.split('/')[1]) <= 4294967295"
                      message: spec.entry's uid must be at most 4294967295
                    - rule: "size(self.split('/')[size(self.split('/')) - 1]) <= 253"
                      message: spec.entry's name must be at most 253 bytes
                    - rule: "!self.startsWith('system/')"
                      message: a system entry cannot be delivered by a KeyDelivery
                secretName:
                  type: string
                  description: SecretName is the target Secret in this namespace. Immutable.
                  minLength: 1
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: spec.secretName is immutable after create
                items:
                  type: array
                  description: Items are the projections into the target Secret's data, each writing one credential field under one data key. Required, with no default; keys are unique. A field the entry's kind does not have is reported as Ready=False ProjectionInvalid. Order is not semantic. Immutable as a map, so a reorder is accepted and any other change refused.
                  minItems: 1
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - key
                  x-kubernetes-validations:
                    - rule: "size(self) == size(oldSelf) && self.all(i, oldSelf.exists(o, o.key == i.key && o.field == i.field))"
                      message: spec.items is immutable after create
                  items:
                    type: object
                    required:
                      - field
                      - key
                    properties:
                      field:
                        type: string
                        description: Field is the credential field to project. No refresh field can be named.
                        maxLength: 32
                        enum:
                          - value
                          - expiresAt
                          - privateKey
                          - publicKey
                          - accessToken
                          - accessExpiresAt
                          - tokenType
                      key:
                        type: string
                        description: Key is the data key in the target Secret, valid as a Secret data key (at most 253 characters of alphanumerics, '-', '_' and '.'; not '.' and not starting with '..').
                        maxLength: 253
                        pattern: '^[-._a-zA-Z0-9]+$'
                        x-kubernetes-validations:
                          - rule: "self != '.' && !self.startsWith('..')"
                            message: an item key must not be '.' or start with '..'
                requestedBy:
                  type: string
                  description: RequestedBy is the local principal k3sm:local:<uid> that declared the delivery; for a user entry, the entry's own uid. Informational, it authorises nothing by itself. Immutable.
                  maxLength: 21
                  pattern: '^k3sm:local:[1-9][0-9]{0,9}$'
                  x-kubernetes-validations:
                    - rule: "self == oldSelf"
                      message: spec.requestedBy is immutable after create
            status:
              type: object
              description: Status is the observed state of the delivery, written through the status subresource. It never carries a value or a fingerprint of one.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: ObservedGeneration is the metadata.generation this status was computed from.
                  minimum: 0
                deliveredVersion:
                  type: integer
                  format: int64
                  description: DeliveredVersion is the entry version the Secret last received; 0 before any delivery.
                  minimum: 0
                conditions:
                  type: array
                  description: >-
                    Conditions are the source of truth, one per type, each with its observedGeneration:
                    writers must set observedGeneration on every condition, since meta.SetStatusCondition
                    does not fill it in.
                    The reasons are a closed set per condition. Authorized - Authorized (True);
                    EntryUnavailable, NotRecorded, NotAuthorized (False); Indeterminate (Unknown).
                    EntryUnavailable means the entry does not exist or is not the requester's: one reason
                    for both. Ready - Delivered (True); NotAuthorized, SecretExists, SecretClaimed,
                    ProjectionInvalid, EncryptionOff, UserScopeOff (False); Pending (Unknown).
                    SecretExists means a Secret not claimed by a KeyDelivery holds the target name;
                    SecretClaimed means an older KeyDelivery owns the target Secret; ProjectionInvalid
                    means an item names a field the entry's kind does not have, and the Secret is left
                    untouched. SecretRetained - DeletePending, Unowned, Indeterminate, LabelRemoved,
                    UserScopeOff, OwnerUnresolvable (True); NoneRetained (False). CredentialValid - Valid,
                    Expiring, RefreshFailing (True); Expired, Revoked (False); Indeterminate (Unknown).
                    Ready means delivered. It does not change on expiry or revocation, so kubectl wait
                    --for=condition=Ready says nothing about the credential's health; health readers read
                    CredentialValid, which is set only for kinds with an expiry (token, oauth). Valid,
                    Expiring and RefreshFailing share True deliberately, because the credential still
                    works in all three; readers key on the reason. A reader treats a reason it does not
                    know as a generic failure of the condition that carries it.
                  maxItems: 8
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - observedGeneration
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
