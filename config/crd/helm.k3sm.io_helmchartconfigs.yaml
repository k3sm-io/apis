# HelmChartConfig CRD (helm.k3sm.io/v1) — k3sm's analog of k3s's
# helm.cattle.io/v1 HelmChartConfig: a values overlay onto the HelmChart of the
# same name in the same namespace.
#
# Hand-authored (apis runs no controller-gen) to match the Go type in
# k3sm.io/apis/helm/v1 (helmchart.go). k3sm applies THIS manifest from the
# embedded bytes in k3sm.io/apis/config/crd; there is no shadow copy.
#
# Served+stored discipline: a SINGLE version v1 is both served and stored, and
# the schema is ADDITIVE-ONLY. k3s's valuesSecrets is reserved and is pruned by
# this structural schema until it is added.
#
# Scope is Namespaced, as in k3s. There is no status subresource: the type
# carries no status, exactly as in k3s.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: helmchartconfigs.helm.k3sm.io
spec:
  group: helm.k3sm.io
  scope: Namespaced
  names:
    kind: HelmChartConfig
    listKind: HelmChartConfigList
    plural: helmchartconfigs
    singular: helmchartconfig
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: HelmChartConfig overlays configuration onto the HelmChart of the same name in the same namespace.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: HelmChartConfigSpec is the overlay.
              properties:
                valuesContent:
                  type: string
                  description: ValuesContent is a YAML values document applied after the HelmChart's own valuesContent.
                failurePolicy:
                  type: string
                  description: FailurePolicy overrides the HelmChart's failurePolicy when set.
                  enum:
                    - abort
                    - reinstall
                forceConflicts:
                  type: boolean
                  description: ForceConflicts overrides the HelmChart's forceConflicts when true.
