// images.proto is the k3sm node image contract: the store-facing RPCs the
// `k3sm image` CLI and the node's image-GC caller drive. It is a separate
// service in the same proto package (k3sm.runtime.v1) — the CRI
// RuntimeService/ImageService split. Image verbs and pod verbs are different
// callers' surfaces, so they get different services; they share one package,
// one generated Go package, and one wire namespace, because a second proto
// package or import path would fork the shared-contracts module for no gain.
//
// Stability contract: as in runtime.proto — field numbers are stable and the
// surface is additive-only forever. Never renumber or repurpose a field; never
// reuse a reserved number/name. Every message keeps the file convention's
// `reserved 100 to 149;` headroom band. `buf breaking` (WIRE_JSON) enforces it.
syntax = "proto3";

package k3sm.runtime.v1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
// Same package, same generated Go package — imported so this file can NAME the
// existing Descriptor / ImageManifest / Platform messages instead of declaring
// parallel ones. No new module dependency: proto2/3 file imports are not Go
// imports, and runtime.proto is unchanged by this carve.
import "runtime/v1/runtime.proto";

option go_package = "k3sm.io/apis/runtime/v1;runtimev1";

// Images is the node-local image service: pull, list, inspect, measure, tag,
// untag, remove, prune, ingest, and export. It is served by the same native runtime daemon (k3sm.io/runtimed)
// that serves `service Runtime`, on the same listener — the split is about
// which caller a surface belongs to, not about which process serves it.
//
// Trust posture (stated precisely — these RPCs are not "root-only"):
//
//   - In the installed posture the runtime is embedded in-process in the one
//     k3sm binary and serves no socket at all. The only unix-socket listener is
//     created by the standalone k3sm-runtimed daemon binary; an embedded node
//     never constructs one, so it exposes these RPCs to no peer whatsoever.
//
//   - The standalone daemon's socket is guarded by POSIX file mode alone: the
//     socket node is 0600 inside a 0700 parent dir, owned by the daemon's own
//     euid (the unprivileged `_k3sm` user in the shipped posture; root only if
//     an operator chooses to run the daemon as root). There is no LOCAL_PEERCRED
//     differentiation on this socket, and pods commonly share the daemon's uid,
//     because the native hostprocess path has no per-pod uid isolation. Absent
//     an explicit Seatbelt deny of the socket path, a process at that uid is
//     indistinguishable from the CLI. The file mode keeps other uids out; it
//     does not partition the daemon's own uid into callers.
//
//   - Consequence for future work: "narrow these RPCs to a subset of callers",
//     or "let `k3sm image ls` work without sudo", needs a new listener and
//     authorizer design — a second socket with its own ownership, plus an
//     authorizer that can actually tell peers apart — never a permission tweak
//     on this one.
//
//   - The mechanical control lives daemon-side, not here: a proto file cannot
//     assert what listener its service is registered on. The assertion that
//     Images is served by the identical server the Runtime service is
//     registered on — so it inherits exactly this socket and no other — is
//     asserted by a gate in the daemon repo.
//
// Skew: v1 is deliberately reactive. A daemon that predates this service
// returns gRPC UNIMPLEMENTED for every method below, and a client treats that
// status as "this daemon has no image service". Capability-band advertisement
// via GetRuntimeInfoResponse's reserved 100..149 band was considered and
// deferred: it would cost a field plus a producer and a consumer on both sides
// to restate what the status code already carries unambiguously.
service Images {
  // ListImages returns the images recorded in the local store. The entries
  // embed the existing Descriptor / ImageManifest / Platform messages rather
  // than re-spelling digest, size, or media type as parallel scalars.
  rpc ListImages(ListImagesRequest) returns (ListImagesResponse);

  // ImageFsInfo returns raw statfs-style measurements of the filesystem backing
  // the image store. It is measurement-shaped only — see FilesystemUsage.
  rpc ImageFsInfo(ImageFsInfoRequest) returns (ImageFsInfoResponse);

  // RemoveImage removes an image ROOT from the local index (an untag). Root
  // removal is authorized and local — an explicit operator/lifecycle action,
  // never a side effect of fetched content. It unlinks no blobs: blob deletion
  // happens only in PruneImages, which re-derives reachability first.
  // Idempotent — removing an absent image succeeds.
  rpc RemoveImage(RemoveImageRequest) returns (RemoveImageResponse);

  // PruneImages deletes unreferenced content. The refusal semantics are
  // daemon-side: deletability is `not reachable(blob, roots)` computed in one
  // transaction over recorded edges, and every unlink re-verifies before it
  // runs (the ratified image-GC provenance model: edges are monotone, roots are
  // digest-pinned, and root removal is authorized and local). This wire carries
  // only the typed outcome: which digests
  // went, and a minimal per-digest reason for each one that was kept, so a
  // dry-run or audit caller can see why a blob survived without the daemon
  // exporting its policy.
  rpc PruneImages(PruneImagesRequest) returns (PruneImagesResponse);

  // LoadImage ingests an image archive the client streams — the `k3sm image
  // load` / `import` path.
  //
  // Client-streaming, and the shape is deliberate: the client sends a metadata
  // frame then chunk frames, and the server replies exactly once at the end.
  // Runtime's Exec/Attach/PortForward are bidirectional; this is the file's
  // first client-streaming RPC, because there is nothing for the server to say
  // until the archive is verified and committed.
  //
  // The daemon is the sole store writer on this path: the client opens the
  // operator's archive (the daemon generally cannot read an operator's home)
  // and streams the bytes; it never writes the content store itself.
  //
  // Digest contract: any client-supplied digest or size is advisory. The server
  // must re-hash the received bytes and reject a mismatch before the lease
  // commits — a client-asserted digest is an input to be verified, never a fact
  // to be trusted (every ingest path re-hashes content against its claimed
  // digest before commit).
  //
  // Lease obligation: the server takes its store lease before the first blob
  // commit and records the reference before releasing it. This is stated here
  // only until the store/metastore package can carry it in its own doc.go.
  // TODO: once that package is promoted, re-point this citation there.
  //
  // LoadImage is not a SignaturePolicy checkpoint. Loaded images are
  // provenance-free by design — an operator-CLI-only surface. This RPC neither
  // evaluates nor records a SignaturePolicy; enforcement stays where it already
  // is, at materialize/exec.
  rpc LoadImage(stream LoadImageRequest) returns (LoadImageResponse);

  // PullImage resolves a reference for a platform and fetches it through the
  // daemon's OWN puller — the same code path a pod-driven pull takes, so it
  // inherits (rather than restates) that path's obligations: every fetched blob
  // is re-hashed against its claimed digest before the lease commits, the
  // disk-pressure gate applies, and the resulting reference is recorded in the
  // local image index. A daemon that served this from a second fetch path would
  // have forked its own verification story.
  //
  // This is explicitly the CLI-pull primitive — `k3sm image pull`. It exists so
  // an operator can WARM and PIN the store ahead of a workload, not so images
  // can arrive by a route pods do not use.
  //
  // Provenance: a successful pull records a reference -> digest index entry — an
  // edge, plus an OPERATOR root over that reference (the ratified image-GC
  // provenance model: edges are monotone, roots are digest-pinned, and root
  // removal is authorized and local). That
  // root is why a pulled-but-unused image survives PruneImages: it stays
  // reachable until the operator removes the name with UntagImage.
  rpc PullImage(PullImageRequest) returns (PullImageResponse);

  // TagImage records an ADDITIONAL reference for a manifest digest that is
  // already in the local store: a new (reference x platform) index entry
  // pointing at existing content. It contacts no registry and writes no blob.
  //
  // Additive only, and that is the whole safety argument — a tag can make
  // content reachable, never unreachable. Two consequences are contract, not
  // implementation detail. The target is named by DIGEST and never by another
  // (mutable) tag, because roots are digest-pinned and resolving a name here
  // would let a concurrent re-pull decide what the new tag means. And this RPC
  // never RE-POINTS an existing entry at a different digest: that would drop the
  // old edge, which is a root removal wearing a tag's clothes. Re-pointing is
  // UntagImage then TagImage — two steps the operator explicitly asked for.
  //
  // Status contract: NOT_FOUND when the digest is absent from the store (a tag
  // may not name content the node does not have); FAILED_PRECONDITION when the
  // (reference x platform) key exists and resolves to a different digest;
  // idempotent OK when it already resolves to this digest. platform is part of
  // the key, never a filter.
  rpc TagImage(TagImageRequest) returns (TagImageResponse);

  // UntagImage removes ONE (reference x platform) index entry. It is the
  // provenance model's sanctioned EXPLICIT UNTAG — an authorized, local root
  // removal the operator requested, never a side effect of fetched content.
  //
  // Untag removes a NAME, not bytes. No blob is unlinked here; content is
  // reclaimed only by PruneImages, which re-derives reachability first. So
  // untagging a name that a live pod's root still pins leaves the content
  // reachable and the pod unharmed — that is the point of separating the two
  // verbs, not a limitation of this one.
  //
  // Deliberately distinct from RemoveImage, whose refusal stands: the shipped
  // daemon answers RemoveImage with UNIMPLEMENTED as a design statement, because
  // image roots are per-pod records and a request shaped as "remove this image"
  // does not say which root the caller owns. UntagImage names exactly one
  // operator-owned entry, which is why it is the removal that can be granted.
  //
  // Status contract: NOT_FOUND when the entry does not exist — untag is
  // deliberately NOT idempotent-by-silence, since the caller asked to remove a
  // specific name; FAILED_PRECONDITION, removing nothing, when platform is unset
  // and the reference has more than one platform entry (an ambiguous untag is
  // never a guess) or when digest is set and the entry resolves elsewhere.
  rpc UntagImage(UntagImageRequest) returns (UntagImageResponse);

  // InspectImage reports what the store knows about one image — the `docker
  // inspect` analog, and the read side of the tag verbs above.
  //
  // The target is a (reference x platform) key or a manifest digest; a digest
  // names content directly and needs no platform. Strictly read-only: it
  // resolves nothing against a registry, takes no lease and records no root, so
  // it can never make content reachable.
  //
  // The entry itself is the EXISTING Image wrapper, so digest, manifest media
  // type and size, resolved platform, and the config and layer descriptors with
  // their own digests and sizes are read out of the same Descriptor /
  // ImageManifest messages ListImages returns; an inspect that re-spelled them
  // would drift from the list on the first divergent edit. What Image cannot
  // carry is the decoded image config, which is ImageConfig below.
  //
  // Every response field is independently optional: an absent field means the
  // daemon reported no value for that fact, never that the image asserts an
  // empty one. That is what lets a later daemon report more without a wire
  // change.
  rpc InspectImage(InspectImageRequest) returns (InspectImageResponse);

  // SaveImage streams one image OUT of the store as a tarred OCI image layout —
  // the `docker save` analog, and the exact inverse of LoadImage's direction.
  //
  // Server-streaming, mirroring LoadImage's framing in reverse: the server sends
  // chunk frames carrying bytes and nothing else, then exactly ONE terminal
  // frame that carries no chunk and instead reports the exported manifest digest
  // and the byte count the server sent. A client that reaches the end of the
  // stream without a terminal frame has a truncated archive and must discard it.
  //
  // One (reference x platform) per call, like every other verb here: exporting a
  // whole multi-platform index is a different archive shape and is not v1.
  //
  // Export takes no lease, records no root and unlinks nothing. The client is
  // the sole writer of the operator's file, the mirror of LoadImage's rule that
  // the daemon is the sole writer of the store: the daemon generally cannot
  // write into an operator's home and must not try.
  rpc SaveImage(SaveImageRequest) returns (stream SaveImageResponse);
}

// ---------------------------------------------------------------------------
// ListImages
// ---------------------------------------------------------------------------

// ListImagesRequest selects which stored images to return. An empty request
// lists everything.
message ListImagesRequest {
  // reference narrows the listing to one pull reference (exact match); empty
  // lists every image in the store.
  string reference = 1;

  // platform narrows a reference that resolved through a multi-platform index:
  // the local image index is keyed by (reference x platform), so a reference
  // alone can name more than one entry. This is the EXISTING Platform message —
  // there is no second platform shape in this module.
  Platform platform = 2;

  reserved 100 to 149;
}

// ListImagesResponse carries the matching store entries.
message ListImagesResponse {
  // images are the matching entries, in unspecified order.
  repeated Image images = 1;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 2;

  reserved 100 to 149;
}

// Image is one entry of the local image index. It is a thin WRAPPER over the
// existing contract messages: every content fact it reports is read out of the
// embedded Descriptor / ImageManifest (and, through the manifest, Platform).
// Digest, size, and media type are NOT re-declared here as scalars — a second
// spelling of those facts is exactly the duplication this module exists to
// prevent, and would immediately drift from the manifest it describes.
message Image {
  // manifest_descriptor is the manifest's OWN content descriptor: media type,
  // digest (what a user reads as the image id), and size in bytes.
  Descriptor manifest_descriptor = 1;

  // manifest is the resolved image manifest — reference, config and layer
  // descriptors, annotations, plus the resolved platform and index_digest for a
  // reference that came through a multi-platform index.
  ImageManifest manifest = 2;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// ImageFsInfo
// ---------------------------------------------------------------------------

// ImageFsInfoRequest is empty (reserved for future per-filesystem selectors).
message ImageFsInfoRequest {
  reserved 100 to 149;
}

// ImageFsInfoResponse carries the raw measurements only; the caller does the
// arithmetic.
message ImageFsInfoResponse {
  // filesystems are the per-filesystem measurements backing the image store (in
  // practice one — the filesystem the blob tree lives on).
  repeated FilesystemUsage filesystems = 1;

  // store_bytes is the measured size of the image store subtree itself: bytes
  // on disk under the store root. It is a raw measurement, never an estimate of
  // what a prune could reclaim.
  uint64 store_bytes = 2;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 3;

  reserved 100 to 149;
}

// FilesystemUsage is a statfs-style measurement of one filesystem at an instant
// — the CRI FilesystemUsage analog.
//
// Measurement-shaped only. It carries raw facts (used / capacity / available
// bytes, inode usage, and when they were sampled) and deliberately carries no
// precomputed reclaimable, budget, threshold, or eligibility field: the daemon
// does that math. That keeps the wire forward-compatible with whatever image-GC
// policy the daemon later adopts — a policy number baked into the contract
// would need redefining (a wire break, or a second confusing field) every time
// the policy moved, while a raw measurement never expires.
message FilesystemUsage {
  // timestamp is when the sample was taken.
  google.protobuf.Timestamp timestamp = 1;

  // mountpoint is the filesystem the measurement was taken on.
  string mountpoint = 2;

  // used_bytes is the filesystem's used capacity in bytes.
  uint64 used_bytes = 3;

  // capacity_bytes is the filesystem's total capacity in bytes.
  uint64 capacity_bytes = 4;

  // available_bytes is what is available to the daemon's euid in bytes (statfs
  // f_bavail * f_bsize — it is not capacity_bytes minus used_bytes on a
  // filesystem that reserves space).
  uint64 available_bytes = 5;

  // inodes_used is the number of inodes in use, when the filesystem reports it.
  uint64 inodes_used = 6;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// RemoveImage
// ---------------------------------------------------------------------------

// RemoveImageRequest names the image root to remove. A root is a (reference x
// platform) index entry; digest pins WHICH manifest that entry must currently
// resolve to, so a concurrent re-pull of a mutable tag cannot make the removal
// hit a different image than the caller meant.
message RemoveImageRequest {
  // reference is the pull reference to remove.
  string reference = 1;

  // platform narrows a reference that resolved through a multi-platform index;
  // unset removes every platform entry for the reference.
  Platform platform = 2;

  // digest, when set, requires the entry to resolve to this manifest digest;
  // the call fails without removing anything if it does not.
  string digest = 3;

  reserved 100 to 149;
}

// RemoveImageResponse reports what was actually removed.
message RemoveImageResponse {
  // removed_references are the index entries this call removed. Empty means the
  // image was already absent — removal is idempotent, not an error.
  repeated string removed_references = 1;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 2;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// PruneImages
// ---------------------------------------------------------------------------

// PruneImagesRequest selects the prune mode.
message PruneImagesRequest {
  // dry_run computes the plan and unlinks nothing; the response is identical in
  // shape, so an audit caller and a real caller read the same fields.
  bool dry_run = 1;

  reserved 100 to 149;
}

// PruneImagesResponse reports the typed outcome of a prune: what went, what
// stayed and why, and how many bytes the unlinks released.
message PruneImagesResponse {
  // removed_digests are the blob digests unlinked (or, under dry_run, the ones
  // that would be).
  repeated string removed_digests = 1;

  // skipped are the blobs the prune considered and KEPT, each with a typed
  // reason — the minimum a dry-run or audit caller needs to see why a blob
  // survived, without the daemon exporting its policy over the wire.
  repeated SkippedBlob skipped = 2;

  // reclaimed_bytes is the size of the removed content (0 under dry_run only if
  // the implementation declines to size a plan it did not execute).
  uint64 reclaimed_bytes = 3;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 4;

  reserved 100 to 149;
}

// SkippedBlob is one blob the prune kept, with the typed reason it was kept.
message SkippedBlob {
  // digest is the blob's content digest, "<algo>:<hex>".
  string digest = 1;

  // reason is the typed cause. It reports a VERDICT the daemon reached; it does
  // not describe the rule that produced it.
  PruneSkipReason reason = 2;

  reserved 100 to 149;
}

// PruneSkipReason is why a prune kept a blob. A dedicated enum rather than the
// runtime FailureReason: FailureReason enumerates pod-operation failures
// (INVALID_POD_BOX, SPAWN, SANDBOX_SETUP), and a kept blob is not a failure at
// all — reusing it would force image outcomes into pod vocabulary.
// UNSPECIFIED means the daemon reported no typed reason.
enum PruneSkipReason {
  PRUNE_SKIP_REASON_UNSPECIFIED = 0;
  // REACHABLE: the blob is reachable from a recorded root, so it is not
  // deletable. This is the general verdict; the two below narrow it.
  PRUNE_SKIP_REASON_REACHABLE = 1;
  // LEASED: an in-flight ingest holds a lease covering the blob.
  PRUNE_SKIP_REASON_LEASED = 2;
  // IN_USE: a live pod's root reaches the blob.
  PRUNE_SKIP_REASON_IN_USE = 3;
  // UNLINK_FAILED: the blob was planned for deletion but the unlink's
  // re-verification refused it, or the unlink itself failed.
  PRUNE_SKIP_REASON_UNLINK_FAILED = 4;
}

// ---------------------------------------------------------------------------
// LoadImage
// ---------------------------------------------------------------------------

// LoadImageRequest is one frame of the ingest stream. The FIRST frame carries
// the metadata (reference, format, and the advisory digest/size) and no chunk;
// every subsequent frame carries a chunk and nothing else.
//
// Every field is bytes or a scalar by design — there is no OCI-typed framing on
// this stream. The archive's own structure is parsed by the daemon from the
// bytes; modeling it on the wire would drag an OCI type system into a module
// whose whole purpose is depending on nothing.
message LoadImageRequest {
  // reference is the pull reference to record the loaded image under. Set on
  // the first frame; ignored on chunk frames.
  string reference = 1;

  // format is the archive format hint. UNSPECIFIED asks the server to detect it
  // from the bytes.
  LoadImageFormat format = 2;

  // digest is the client's claim about the archive's content digest. ADVISORY:
  // the server re-hashes what it receives and rejects a mismatch before the
  // lease commits. A caller that cannot compute it leaves it empty.
  string digest = 3;

  // size is the client's claim about the archive's byte length. ADVISORY, the
  // same way digest is — usable for progress or an early reject, never as proof.
  int64 size = 4;

  // chunk is the next slice of archive bytes. Chunk boundaries carry no
  // meaning; the server concatenates them in arrival order.
  bytes chunk = 5;

  reserved 100 to 149;
}

// LoadImageFormat is the archive format of a LoadImage stream.
enum LoadImageFormat {
  // UNSPECIFIED asks the server to detect the format from the bytes.
  LOAD_IMAGE_FORMAT_UNSPECIFIED = 0;
  // DOCKER_SAVE is a `docker save` tar.
  LOAD_IMAGE_FORMAT_DOCKER_SAVE = 1;
  // OCI_LAYOUT is an OCI image-layout directory, tarred.
  LOAD_IMAGE_FORMAT_OCI_LAYOUT = 2;
}

// LoadImageResponse is the single terminal response of an ingest — v1 reports
// only the finished outcome.
//
// Per-chunk progress was considered and deferred. A client-streaming RPC cannot
// carry interim server messages at all, so progress is not a field this
// message's reserved band could ever grow into: it would be a new bidirectional
// RPC.
message LoadImageResponse {
  // images are the images the archive contributed, as recorded in the store —
  // the same wrapper ListImages returns, so a load and a subsequent list agree
  // by construction.
  repeated Image images = 1;

  // received_bytes is the byte count the SERVER counted off the stream, not the
  // client's advisory size.
  int64 received_bytes = 2;

  // error carries a structured failure (empty on success) — notably a digest
  // mismatch, which fails the call and commits nothing.
  google.rpc.Status error = 3;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// PullImage
// ---------------------------------------------------------------------------

// PullImageRequest names the reference to resolve and fetch.
message PullImageRequest {
  // reference is the pull reference (registry/repo:tag or registry/repo@digest).
  string reference = 1;

  // platform selects which manifest of a multi-platform index to fetch. Unset
  // asks for the daemon's own host platform — the same default a pod-driven
  // pull takes, never "every platform".
  Platform platform = 2;

  // policy carries corev1 pull-policy semantics, reusing the EXISTING
  // ImagePullPolicy enum rather than spelling the same three behaviors a second
  // time for the CLI. UNSPECIFIED is the legacy pull-through behavior (attempt
  // the pull, reusing cached blobs) in both skew directions, exactly as it is on
  // Container.image_pull_policy; NEVER performs no registry round trip at all
  // and fails NOT_FOUND when the reference is locally absent.
  ImagePullPolicy policy = 3;

  reserved 100 to 149;
}

// PullImageResponse reports what the pull resolved to.
message PullImageResponse {
  // image is the resolved store entry — the same Image wrapper ListImages
  // returns, so the resolved digest, the resolved platform, and the manifest
  // media type and size are read out of the embedded Descriptor /
  // ImageManifest instead of being re-spelled here as parallel scalars.
  Image image = 1;

  // already_present is true when the reference already resolved to this digest
  // locally and no blob was fetched. It is a fact about THIS call, for the
  // caller's output ("image is up to date"); it never changes what was
  // recorded, and a pull that hit is as much a root as a pull that fetched.
  bool already_present = 2;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 3;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// TagImage / UntagImage
// ---------------------------------------------------------------------------

// TagImageRequest names existing content and the new reference to record for
// it. Nothing here can fetch: every field describes an index entry.
message TagImageRequest {
  // digest is the manifest digest of the content to name, "<algo>:<hex>". The
  // target is a digest and never another tag, because roots are digest-pinned:
  // resolving a mutable name here would let a concurrent re-pull decide what
  // the new tag ends up meaning.
  string digest = 1;

  // reference is the NEW pull reference to record for that digest.
  string reference = 2;

  // platform is part of the index key, not a filter — the store is keyed by
  // (reference x platform), so the entry this call creates is the pair. Unset
  // records the entry under the platform the digest itself resolved to.
  Platform platform = 3;

  reserved 100 to 149;
}

// TagImageResponse reports the recorded entry.
message TagImageResponse {
  // image is the index entry as recorded — the same wrapper ListImages returns,
  // so a tag and a subsequent list agree by construction.
  Image image = 1;

  // already_present is true when the (reference x platform) key already
  // resolved to this digest and nothing was written: the idempotent repeat.
  bool already_present = 2;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 3;

  reserved 100 to 149;
}

// UntagImageRequest names the single index entry to remove.
message UntagImageRequest {
  // reference is the pull reference whose entry to remove.
  string reference = 1;

  // platform selects the entry when the reference has more than one. Unset
  // selects the reference's single entry and is an error, removing nothing,
  // when several exist. Unlike RemoveImageRequest.platform, unset NEVER means
  // "every platform" — this verb removes one name.
  Platform platform = 2;

  // digest, when set, requires the entry to currently resolve to this manifest
  // digest; the call fails and removes nothing if it does not. It is the guard
  // against a concurrent re-pull of a mutable tag moving the entry between the
  // caller's read and this write.
  string digest = 3;

  reserved 100 to 149;
}

// UntagImageResponse reports the entry whose name was removed.
message UntagImageResponse {
  // removed is the entry as it stood immediately before removal — the same
  // wrapper ListImages returns, so the caller can report exactly which digest
  // lost a name. The bytes it describes are still on disk: only the name is
  // gone, and only PruneImages reclaims content.
  Image removed = 1;

  // error carries a structured failure (empty on success) — NOT_FOUND when the
  // entry did not exist.
  google.rpc.Status error = 2;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// InspectImage
// ---------------------------------------------------------------------------

// InspectImageRequest names the image to inspect, by reference or by digest.
message InspectImageRequest {
  // reference is the pull reference to inspect. Exactly one of reference or
  // digest identifies the target; setting both is INVALID_ARGUMENT rather than
  // a precedence rule nobody can remember.
  string reference = 1;

  // platform selects which entry of a multi-platform reference to inspect.
  // Unset selects the reference's single entry and is an error when several
  // exist. Ignored when digest is set — a digest names one manifest.
  Platform platform = 2;

  // digest names the manifest directly, "<algo>:<hex>".
  string digest = 3;

  reserved 100 to 149;
}

// InspectImageResponse carries everything the store knows about one image.
// Every field is independently optional and additive: an absent field means the
// daemon reported no value for that fact, never that the image asserts an empty
// one.
message InspectImageResponse {
  // image is the store entry: the manifest descriptor (digest, media type,
  // size) plus the resolved manifest — config and layer descriptors with their
  // own digests and sizes, annotations, resolved platform, and index digest.
  Image image = 1;

  // config is the DECODED image config blob: the facts that live inside the
  // config's JSON and so cannot be carried by a Descriptor.
  ImageConfig config = 2;

  // total_size_bytes is the sum of the sizes of the DISTINCT blobs the image is
  // made of — manifest, config, and each layer counted once. It is what the
  // image measures, never what removing it would reclaim: layers shared with
  // another image are counted here and would survive a prune.
  uint64 total_size_bytes = 3;

  // error carries a structured failure (empty on success).
  google.rpc.Status error = 4;

  reserved 100 to 149;
}

// ImageConfig is the decoded OCI image config — the process defaults a runtime
// merges with the container spec, plus the image's own identity metadata.
//
// It is a REPORT of what the image declares, never an input: no field here is
// applied by writing it back, and the runtime's own merge of Entrypoint/Cmd
// with a container's command/args is unchanged by this message existing.
message ImageConfig {
  // platform is the platform the config blob itself DECLARES. It is the
  // existing Platform message, and it is NOT the same fact as
  // ImageManifest.platform, which is the platform the reference resolved to
  // through an index: they agree on a well-formed image, and a disagreement is
  // worth being able to see.
  Platform platform = 1;

  // created is the image's declared creation time.
  google.protobuf.Timestamp created = 2;

  // entrypoint is the config's Entrypoint, in order.
  repeated string entrypoint = 3;

  // cmd is the config's Cmd, in order.
  repeated string cmd = 4;

  // env are the config's environment entries in OCI "KEY=value" form, verbatim
  // and in order. Deliberately not a map: the OCI form permits repeated keys
  // and is order-significant, and a map would silently pick a winner.
  repeated string env = 5;

  // user is the config's User ("uid", "uid:gid", or a name), reported exactly as
  // the image spells it. Information, not an enforcement claim: the native
  // hostprocess path has no per-pod uid isolation.
  string user = 6;

  // working_dir is the config's WorkingDir.
  string working_dir = 7;

  // labels are the config's Labels.
  map<string, string> labels = 8;

  reserved 100 to 149;
}

// ---------------------------------------------------------------------------
// SaveImage
// ---------------------------------------------------------------------------

// SaveImageRequest names the single image to export.
message SaveImageRequest {
  // reference is the pull reference to export. Exactly one of reference or
  // digest identifies the target.
  string reference = 1;

  // platform selects the entry of a multi-platform reference; unset selects the
  // reference's single entry and is an error when several exist. One
  // (reference x platform) per call — a whole-index export is a different
  // archive shape and is not v1.
  Platform platform = 2;

  // digest names the manifest to export directly, "<algo>:<hex>".
  string digest = 3;

  // format is the archive format to emit, reusing the EXISTING LoadImageFormat
  // vocabulary rather than declaring a second spelling of the same two formats
  // for the opposite direction. UNSPECIFIED means OCI_LAYOUT, the only format
  // v1 emits; DOCKER_SAVE is nameable on the wire and may be answered
  // UNIMPLEMENTED.
  LoadImageFormat format = 4;

  reserved 100 to 149;
}

// SaveImageResponse is one frame of the export stream. Every frame but the last
// carries a chunk and nothing else; the LAST frame carries no chunk and instead
// reports the exported manifest digest and the byte count the server sent.
//
// The framing mirrors LoadImage in reverse — metadata frame first there, summary
// frame last here — for the same reason it works there: the fact worth reporting
// is only known once the transfer ends. A client that reaches the end of the
// stream WITHOUT a terminal frame has a truncated archive and must discard it,
// because a short final chunk is otherwise indistinguishable from a complete
// one.
//
// Apart from the shared error status, the frame carries bytes and scalars only,
// exactly as LoadImageRequest does: the archive's structure travels in its own
// bytes, and modeling it on the wire would drag an OCI type system into a module
// whose whole purpose is depending on nothing.
message SaveImageResponse {
  // chunk is the next slice of archive bytes. Chunk boundaries carry no
  // meaning; the client concatenates them in arrival order.
  bytes chunk = 1;

  // digest is the exported manifest's digest, "<algo>:<hex>", set on the
  // terminal frame only. Unlike LoadImage's advisory client claim, this is the
  // server reporting what it exported.
  string digest = 2;

  // sent_bytes is the total archive length the SERVER wrote to the stream, set
  // on the terminal frame only. A client that counted a different number has a
  // truncated archive.
  int64 sent_bytes = 3;

  // error carries a structured failure (empty on success). A failure that
  // happens mid-transfer arrives as a terminal frame with error set and no
  // chunk, so a client never has to infer failure from a stream that merely
  // stopped.
  google.rpc.Status error = 4;

  reserved 100 to 149;
}
