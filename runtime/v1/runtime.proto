// Package runtime.v1 is the k3sm node runtime contract: the gRPC API the
// k3sm Virtual Kubelet provider (k3sm.io/k3sm) calls and the native runtime
// daemon (k3sm.io/runtimed) implements. Pods run as native Darwin processes
// (no Linux, no chroot) confined by a per-pod Seatbelt profile — see
// k3sm/docs/DESIGN.md §5a.
//
// Stability contract: field numbers are STABLE and the surface is
// ADDITIVE-ONLY forever. Never renumber or repurpose a field; never reuse a
// reserved number/name. `buf breaking` (WIRE_JSON) enforces this.
syntax = "proto3";

package k3sm.runtime.v1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "k3sm.io/apis/runtime/v1;runtimev1";

// Runtime is the node-local pod runtime. Every RPC is pod-granular: the unit
// of work is a whole Pod (a "PodBox"), never an individual container, because
// k3sm has no namespaces — a pod is one process group / uid / Seatbelt domain.
//
// RPC numbering note: gRPC method names (not numbers) are the wire identity, so
// there is no numeric range to reserve. The M2 process-split adds resource and
// metrics RPCs to THIS service — append-only; do not remove or rename the
// methods below. M2.2 appends ListPodStats and RestartContainer.
service Runtime {
  // CreatePod materializes and starts a PodBox: it creates the per-pod dir,
  // applies the Seatbelt profile, and posix_spawns each container as a native
  // process. Idempotent on pod id (a second call for a live pod is a no-op).
  rpc CreatePod(CreatePodRequest) returns (CreatePodResponse);

  // DeletePod kills the pod's process group (SIGKILL), tears down the PodBox,
  // and forgets it. Idempotent: deleting an unknown pod succeeds.
  rpc DeletePod(DeletePodRequest) returns (DeletePodResponse);

  // UpdatePod applies an in-place spec change to a running pod (e.g. an
  // annotation or, at M2, a resource limit). The runtime decides what is
  // updatable in place vs. requires recreate; non-updatable fields are an error.
  rpc UpdatePod(UpdatePodRequest) returns (UpdatePodResponse);

  // WatchPodStatus is a server stream of PodStatus snapshots. The VK
  // PodNotifier consumes this to drive kubectl Pod state event-driven, with no
  // polling. The server SHOULD emit the current status immediately on subscribe
  // and then on every transition. Watching a single pod (pod_id set) or all
  // pods on the node (pod_id empty) are both valid.
  rpc WatchPodStatus(WatchPodStatusRequest) returns (stream PodStatusEvent);

  // GetPodStatus returns a single point-in-time PodStatus (the request/response
  // counterpart to WatchPodStatus, for callers that don't want a stream).
  rpc GetPodStatus(GetPodStatusRequest) returns (GetPodStatusResponse);

  // GetLogs is a server stream of a container's combined stdout/stderr. Honors
  // follow/tail/since like `kubectl logs`.
  rpc GetLogs(GetLogsRequest) returns (stream LogEntry);

  // Exec runs a command in a container (`kubectl exec`). Bidirectional stream:
  // client sends stdin + a resize channel, server sends stdout/stderr and a
  // final exit code.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);

  // Attach attaches to a container's running process streams (`kubectl attach`).
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);

  // PortForward forwards a local stream to a pod port (`kubectl port-forward`).
  // Bidirectional: framed payloads carry the per-connection port + bytes.
  rpc PortForward(stream PortForwardRequest) returns (stream PortForwardResponse);

  // GetRuntimeInfo returns the daemon's version and health. The M2 process
  // split (provider and runtimed as separate processes) uses this for the
  // version-compat handshake across the IPC boundary.
  rpc GetRuntimeInfo(GetRuntimeInfoRequest) returns (GetRuntimeInfoResponse);

  // ListPodStats returns a resource-usage snapshot for pods on the node — the
  // metrics path behind `kubectl top` / the kubelet Summary API. pod_id empty =
  // all pods on the node; pod_id set = that one pod. runtimed sources each
  // sample from proc_pid_rusage (ri_phys_footprint, NOT RSS); the provider
  // serves the Summary API from them. Added in M2.2 (append-only).
  rpc ListPodStats(ListPodStatsRequest) returns (ListPodStatsResponse);

  // RestartContainer restarts a single container in a running pod in place
  // (terminate its process within the grace window, then re-spawn from the same
  // spec) and increments ContainerStatus.restart_count. A failed liveness probe
  // drives this — it is the runtime action the provider's probe runner invokes
  // (the seam that, pre-M2.2, only bumped restart_count via a nil restartFunc).
  // Added in M2.2 (append-only).
  rpc RestartContainer(RestartContainerRequest) returns (RestartContainerResponse);
}

// ---------------------------------------------------------------------------
// PodBox — the runtime's unit of execution (DESIGN §5a).
// ---------------------------------------------------------------------------

// PodBox is everything the runtime needs to instantiate one pod as a native
// process group: identity, rootfs, the uid/gid it runs as, its loopback pod
// IP, and the inputs the SBPL generator turns into a default-deny Seatbelt
// profile. This is the SINGLE definition of a PodBox — there is no parallel
// hand-written Go struct.
message PodBox {
  // pod_id is the stable runtime id for the pod (the kube Pod UID).
  string pod_id = 1;

  // namespace and name are the kube coordinates, for logs/diagnostics.
  string namespace = 2;
  string name = 3;

  // rootfs_path is the per-pod dir, e.g. /var/lib/k3sm/pods/<id>/rootfs, into
  // which image payloads are clonefile'd and run in place at host paths.
  string rootfs_path = 4;

  // uid and gid are the dedicated user/group the pod's processes run as.
  uint32 uid = 5;
  uint32 gid = 6;

  // pod_ip is the lo0 alias (a /32 from the node podCIDR) the runtime binds the
  // pod's processes to. pod_ips carries dual-stack if ever applicable; pod_ips[0]
  // == pod_ip.
  string pod_ip = 7;
  repeated string pod_ips = 8;

  // containers are the workloads to spawn, in order. init_containers run first,
  // sequentially, each to completion.
  repeated Container init_containers = 9;
  repeated Container containers = 10;

  // sandbox_profile carries the inputs the SBPL generator needs to emit the
  // per-pod default-deny Seatbelt profile.
  SandboxProfile sandbox_profile = 11;

  // signature_policy is the binary-signature gate enforced before exec.
  SignaturePolicy signature_policy = 12;

  // labels and annotations mirror the kube object metadata the runtime needs.
  map<string, string> labels = 13;
  map<string, string> annotations = 14;

  // volumes are the pod-level volume sources Container.volume_mounts reference
  // by name. runtimed:M2 materializes payloads inside the pod data-volume; the
  // proto carries only the source spec. Mirrors corev1.PodSpec.Volumes.
  repeated Volume volumes = 15;

  // pod_security_context is the pod-scoped privilege configuration. fs_group
  // lives HERE (pod-level only), not on Container.security_context. Mirrors
  // corev1.PodSpec.SecurityContext.
  PodSecurityContext pod_security_context = 16;

  // termination_grace_period_seconds is the SIGTERM→SIGKILL window the provider
  // derives DeletePodRequest.grace_period_seconds from. Mirrors
  // corev1.PodSpec.TerminationGracePeriodSeconds.
  int64 termination_grace_period_seconds = 17;

  // image_pull_secrets are references to Secrets carrying private-registry
  // credentials. runtimed confines the credential to the pull client.
  // Mirrors corev1.PodSpec.ImagePullSecrets.
  repeated LocalObjectReference image_pull_secrets = 18;

  // --- M2.2 resource limits (allocated from PodBox's reserved 100..199 band;
  // they never collide with the M2.1 low-number fields above) ---

  // memory_limit_bytes is the resolved per-pod memory limit in bytes (the
  // provider converts the corev1 resource.Quantity). runtimed:M2.2 compares the
  // pod's ri_phys_footprint (proc_pid_rusage — NOT RSS) against this to drive
  // OOMKilled. 0 means no memory limit (BestEffort). This typed field replaces
  // the M2.1 k3sm.io/memory-limit-bytes annotation seam runtimed bridged it on.
  int64 memory_limit_bytes = 100;

  // qos_class is the pod's resolved Quality-of-Service class. runtimed uses it
  // for best-effort CPU policy (k3sm has no CFS millicore enforcement — see
  // ../../docs/stockkitty-readiness.md); the provider also mirrors it into
  // PodStatus.qos_class (string). Mirrors corev1 PodStatus.QOSClass as an enum.
  QOSClass qos_class = 101;

  // rlimits are the POSIX resource limits runtimed applies via setrlimit(2)
  // before spawning each container process (e.g. RLIMIT_NOFILE, RLIMIT_NPROC).
  // Modeled OCI-style (a list of typed soft/hard caps) so new limit types are
  // additive without new fields.
  repeated ResourceLimit rlimits = 102;

  // 100..102 are now allocated above; 103..199 stay reserved for future
  // resource/metrics inputs. The band's 199 ceiling is preserved (additive).
  reserved 103 to 199;
}

// Volume is a named pod-level volume with exactly one source set. Mirrors the
// M2.1 subset of corev1.Volume (configMap / secret / emptyDir / downwardAPI /
// projected); the source union is modeled as optional message fields, matching
// the ContainerState pointer-union precedent.
message Volume {
  // name is the volume name, referenced by VolumeMount.name. Unique within the
  // pod.
  string name = 1;

  // config_map, secret, empty_dir, downward_api, and projected are the source
  // union: exactly one is set.
  ConfigMapVolumeSource config_map = 2;
  SecretVolumeSource secret = 3;
  EmptyDirVolumeSource empty_dir = 4;
  DownwardAPIVolumeSource downward_api = 5;
  ProjectedVolumeSource projected = 6;
}

// ConfigMapVolumeSource mounts a ConfigMap as files. Mirrors
// corev1.ConfigMapVolumeSource.
message ConfigMapVolumeSource {
  // name is the ConfigMap name.
  string name = 1;
  // items, when set, selects specific keys to project (else all keys).
  repeated KeyToPath items = 2;
  // default_mode is the default file permission bits (e.g. 0644); 0 means unset.
  int32 default_mode = 3;
  // optional, when true, tolerates a missing ConfigMap.
  bool optional = 4;
}

// SecretVolumeSource mounts a Secret as files (read-only sub-scope
// runtimed-side). Mirrors corev1.SecretVolumeSource.
message SecretVolumeSource {
  // secret_name is the Secret name.
  string secret_name = 1;
  // items, when set, selects specific keys to project (else all keys).
  repeated KeyToPath items = 2;
  // default_mode is the default file permission bits; 0 means unset.
  int32 default_mode = 3;
  // optional, when true, tolerates a missing Secret.
  bool optional = 4;
}

// EmptyDirVolumeSource is an ephemeral scratch volume. Mirrors
// corev1.EmptyDirVolumeSource (M2.1 subset: medium + size_limit as a string
// quantity).
message EmptyDirVolumeSource {
  // medium is "" (node default) or "Memory".
  string medium = 1;
  // size_limit is a resource.Quantity string (e.g. "1Gi"); empty means unset.
  string size_limit = 2;
}

// DownwardAPIVolumeSource mounts pod fields as files. Mirrors
// corev1.DownwardAPIVolumeSource.
message DownwardAPIVolumeSource {
  // items are the field projections.
  repeated DownwardAPIVolumeFile items = 1;
  // default_mode is the default file permission bits; 0 means unset.
  int32 default_mode = 2;
}

// DownwardAPIVolumeFile projects one pod field to a file. Mirrors
// corev1.DownwardAPIVolumeFile (M2.1 subset: field_ref only, no
// resourceFieldRef).
message DownwardAPIVolumeFile {
  // path is the relative file path to write within the volume.
  string path = 1;
  // field_ref selects the pod field (e.g. metadata.name, status.podIP).
  ObjectFieldSelector field_ref = 2;
  // mode is the file permission bits for this file; 0 means unset.
  int32 mode = 3;
}

// ProjectedVolumeSource combines multiple projection sources into one volume.
// It MUST carry the serviceAccountToken projection (bound token — the
// in-pod-kubectl path). Mirrors corev1.ProjectedVolumeSource.
message ProjectedVolumeSource {
  // sources are the individual projections, layered into one directory.
  repeated VolumeProjection sources = 1;
  // default_mode is the default file permission bits; 0 means unset.
  int32 default_mode = 2;
}

// VolumeProjection is one projection within a ProjectedVolumeSource. Exactly
// one source is set. Mirrors corev1.VolumeProjection (M2.1 subset: configMap /
// secret / downwardAPI / serviceAccountToken).
message VolumeProjection {
  ConfigMapProjection config_map = 1;
  SecretProjection secret = 2;
  DownwardAPIProjection downward_api = 3;
  ServiceAccountTokenProjection service_account_token = 4;
}

// ConfigMapProjection projects ConfigMap keys into a projected volume. Mirrors
// corev1.ConfigMapProjection.
message ConfigMapProjection {
  string name = 1;
  repeated KeyToPath items = 2;
  bool optional = 3;
}

// SecretProjection projects Secret keys into a projected volume. Mirrors
// corev1.SecretProjection.
message SecretProjection {
  string name = 1;
  repeated KeyToPath items = 2;
  bool optional = 3;
}

// DownwardAPIProjection projects pod fields into a projected volume. Mirrors
// corev1.DownwardAPIProjection.
message DownwardAPIProjection {
  repeated DownwardAPIVolumeFile items = 1;
}

// ServiceAccountTokenProjection projects a bound ServiceAccount token. The
// audience + expiration carry the bound-token semantics the in-pod-kubectl path
// needs. Mirrors corev1.ServiceAccountTokenProjection.
message ServiceAccountTokenProjection {
  // audience is the intended audience of the token (default: the apiserver).
  string audience = 1;
  // expiration_seconds is the requested token TTL.
  int64 expiration_seconds = 2;
  // path is the relative file path to write the token to within the volume.
  string path = 3;
}

// KeyToPath maps a ConfigMap/Secret key to a relative file path. Mirrors
// corev1.KeyToPath.
message KeyToPath {
  // key is the source key.
  string key = 1;
  // path is the relative file path to write.
  string path = 2;
  // mode is the file permission bits; 0 means unset.
  int32 mode = 3;
}

// PodSecurityContext is the pod-scoped privilege configuration. fs_group lives
// HERE (pod-level only). Mirrors the M2.1 subset of corev1.PodSecurityContext.
// int64 mirrors corev1's *int64; 0 is a valid value (root).
message PodSecurityContext {
  // fs_group is the supplemental group applied to volume ownership (chown
  // root-side before the privilege drop).
  int64 fs_group = 1;
  // run_as_user is the default uid for containers lacking their own.
  int64 run_as_user = 2;
  // run_as_group is the default gid for containers lacking their own.
  int64 run_as_group = 3;
}

// LocalObjectReference references a namespace-local object by name (e.g. an
// imagePullSecret). Mirrors corev1.LocalObjectReference.
message LocalObjectReference {
  // name is the referenced object's name.
  string name = 1;
}

// Container is one workload process within a PodBox.
message Container {
  // name is unique within the pod.
  string name = 1;

  // image is the OCI image reference (or, for the M0 convention, a host binary
  // path when command/args are empty).
  string image = 2;

  // command and args form argv: argv = command + args. If both are empty the
  // image reference is treated as the binary path (M0 convention).
  repeated string command = 3;
  repeated string args = 4;

  // working_dir is the process working directory (empty = pod rootfs default).
  string working_dir = 5;

  // env are the environment variables, merged over the host environment.
  repeated EnvVar env = 6;

  // tty requests a pseudo-terminal for the container's process.
  bool tty = 7;

  // stdin keeps stdin open for the container's process.
  bool stdin = 8;

  // volume_mounts mount PodBox.volumes into the container's view by name.
  // Mirrors corev1.Container.VolumeMounts.
  repeated VolumeMount volume_mounts = 9;

  // ports declares named container ports. The named-port table lets named probe
  // ports and named Service targetPorts resolve. Mirrors
  // corev1.Container.Ports.
  repeated ContainerPort ports = 10;

  // liveness_probe, readiness_probe, and startup_probe are the provider-served
  // health probes. liveness restarts the container on failure; readiness gates
  // ContainerStatus.ready (and thus Service endpoints); startup gates the
  // others until it first succeeds. Mirror corev1.Container.{Liveness,
  // Readiness,Startup}Probe.
  Probe liveness_probe = 11;
  Probe readiness_probe = 12;
  Probe startup_probe = 13;

  // security_context is the container-scoped privilege configuration (uid/gid
  // drop, run-as-non-root). Pod-scoped fields (fsGroup) live on
  // PodBox.pod_security_context. Mirrors corev1.Container.SecurityContext.
  SecurityContext security_context = 14;

  // env_from populates env from whole ConfigMaps/Secrets, with an optional
  // per-source name prefix. Mirrors corev1.Container.EnvFrom.
  repeated EnvFromSource env_from = 15;

  reserved 100 to 149; // M2.2: per-container resource limits.
}

// EnvVar is a single environment variable. Exactly one of value or value_from
// is set (corev1 mutual exclusion); an unset value_from means value is literal.
message EnvVar {
  string name = 1;
  // value is the literal value. Mutually exclusive with value_from.
  string value = 2;
  // value_from sources the value from the downward API or a ConfigMap/Secret
  // key. Mutually exclusive with value. Mirrors corev1.EnvVar.ValueFrom.
  EnvVarSource value_from = 3;
}

// VolumeMount mounts a PodBox.volume into a container by name. Mirrors
// corev1.VolumeMount (M2.1 subset: no mountPropagation/recursiveReadOnly).
message VolumeMount {
  // name references a PodBox.volumes[].name.
  string name = 1;
  // mount_path is the path inside the container's view to mount at.
  string mount_path = 2;
  // read_only mounts the volume read-only (secrets / SA-token get a read-only
  // sub-scope runtimed-side).
  bool read_only = 3;
  // sub_path mounts a single file/dir from within the volume rather than its
  // root.
  string sub_path = 4;
}

// ContainerPort declares a named port a container exposes. Mirrors
// corev1.ContainerPort (M2.1 subset: name + containerPort + protocol; host_port
// / host_ip are not modeled — k3sm pods bind the pod IP, not host ports).
message ContainerPort {
  // name is the port name, referenced by named probe ports and named Service
  // targetPorts. Unique within the container.
  string name = 1;
  // container_port is the port number the container listens on.
  int32 container_port = 2;
  // protocol is "TCP" (default), "UDP", or "SCTP", carried verbatim from
  // corev1.Protocol.
  string protocol = 3;
}

// Probe is a provider-served health check. Exactly one handler (http_get,
// tcp_socket, exec) is set — modeled as three optional message fields, matching
// the ContainerState pointer-union precedent. Mirrors corev1.Probe.
message Probe {
  // initial_delay_seconds is the delay before the first probe after the
  // container starts.
  int32 initial_delay_seconds = 1;
  // period_seconds is how often to probe.
  int32 period_seconds = 2;
  // timeout_seconds is the per-probe timeout.
  int32 timeout_seconds = 3;
  // success_threshold is the consecutive successes required to be considered
  // healthy after a failure (must be 1 for liveness/startup).
  int32 success_threshold = 4;
  // failure_threshold is the consecutive failures required to give up.
  int32 failure_threshold = 5;

  // http_get, tcp_socket, and exec are the handler union: exactly one is set.
  HTTPGetAction http_get = 6;
  TCPSocketAction tcp_socket = 7;
  ExecAction exec = 8;
}

// HTTPGetAction is an HTTP GET probe handler. Mirrors corev1.HTTPGetAction.
message HTTPGetAction {
  // path is the request path.
  string path = 1;
  // port is the target port — an int or a named ContainerPort (resolved via the
  // named-port table).
  IntOrString port = 2;
  // scheme is "HTTP" (default) or "HTTPS".
  string scheme = 3;
  // host is the host header / target host; empty defaults to the pod IP.
  string host = 4;
  // http_headers are extra request headers.
  repeated HTTPHeader http_headers = 5;
}

// HTTPHeader is one custom HTTP probe header. Mirrors corev1.HTTPHeader.
message HTTPHeader {
  string name = 1;
  string value = 2;
}

// TCPSocketAction is a TCP-connect probe handler. Mirrors
// corev1.TCPSocketAction.
message TCPSocketAction {
  // port is the target port — an int or a named ContainerPort.
  IntOrString port = 1;
  // host is the target host; empty defaults to the pod IP.
  string host = 2;
}

// ExecAction is a command-exec probe handler: the probe succeeds iff the
// command exits 0. Mirrors corev1.ExecAction.
message ExecAction {
  // command is argv run inside the container.
  repeated string command = 1;
}

// IntOrString mirrors k8s.io/apimachinery intstr.IntOrString: a value that is
// either an int (a port number) or a string (a named ContainerPort). Exactly
// one is meaningful; a non-empty str_val selects the string form, matching the
// intstr Type discriminator.
message IntOrString {
  // int_val is the integer form (e.g. a literal port number).
  int32 int_val = 1;
  // str_val is the string form (e.g. a named container port).
  string str_val = 2;
}

// SecurityContext is the container-scoped privilege configuration. fsGroup is
// NOT here — it is pod-scoped (PodSecurityContext.fs_group). Mirrors the M2.1
// subset of corev1.SecurityContext. The int64 *_as_* fields mirror corev1's
// *int64 (uid/gid); 0 is a valid value (root), so callers needing "unset" must
// track presence out of band per their own convention.
message SecurityContext {
  // run_as_user is the uid the container process runs as.
  int64 run_as_user = 1;
  // run_as_group is the gid the container process runs as.
  int64 run_as_group = 2;
  // run_as_non_root, when true, requires the resolved uid to be non-zero.
  bool run_as_non_root = 3;
}

// EnvFromSource populates env from a whole ConfigMap or Secret, with an
// optional name prefix applied to every key. Exactly one of config_map_ref /
// secret_ref is set. Mirrors corev1.EnvFromSource.
message EnvFromSource {
  // prefix is prepended to every env name sourced here.
  string prefix = 1;
  // config_map_ref selects a ConfigMap whose keys become env vars.
  ConfigMapEnvSource config_map_ref = 2;
  // secret_ref selects a Secret whose keys become env vars.
  SecretEnvSource secret_ref = 3;
}

// ConfigMapEnvSource selects a ConfigMap for env_from. Mirrors
// corev1.ConfigMapEnvSource.
message ConfigMapEnvSource {
  // name is the ConfigMap name.
  string name = 1;
  // optional, when true, tolerates a missing ConfigMap.
  bool optional = 2;
}

// SecretEnvSource selects a Secret for env_from. Mirrors corev1.SecretEnvSource.
message SecretEnvSource {
  // name is the Secret name.
  string name = 1;
  // optional, when true, tolerates a missing Secret.
  bool optional = 2;
}

// EnvVarSource is the source for an EnvVar value (the corev1 union). Exactly one
// of field_ref / config_map_key_ref / secret_key_ref is set. Mirrors
// corev1.EnvVarSource (M2.1 subset: no resourceFieldRef).
message EnvVarSource {
  // field_ref sources from the downward API (e.g. spec.nodeName, status.podIP,
  // metadata.name).
  ObjectFieldSelector field_ref = 1;
  // config_map_key_ref sources from a single ConfigMap key.
  ConfigMapKeySelector config_map_key_ref = 2;
  // secret_key_ref sources from a single Secret key.
  SecretKeySelector secret_key_ref = 3;
}

// ObjectFieldSelector selects a downward-API field path. Mirrors
// corev1.ObjectFieldSelector.
message ObjectFieldSelector {
  // api_version is the schema version of field_path (defaults to "v1").
  string api_version = 1;
  // field_path is the path to select, e.g. "spec.nodeName", "status.podIP",
  // "metadata.name".
  string field_path = 2;
}

// ConfigMapKeySelector selects one key of a ConfigMap. Mirrors
// corev1.ConfigMapKeySelector.
message ConfigMapKeySelector {
  // name is the ConfigMap name.
  string name = 1;
  // key is the key within the ConfigMap.
  string key = 2;
  // optional, when true, tolerates a missing ConfigMap/key.
  bool optional = 3;
}

// SecretKeySelector selects one key of a Secret. Mirrors
// corev1.SecretKeySelector.
message SecretKeySelector {
  // name is the Secret name.
  string name = 1;
  // key is the key within the Secret.
  string key = 2;
  // optional, when true, tolerates a missing Secret/key.
  bool optional = 3;
}

// SandboxProfile is the input to the per-pod SBPL (Seatbelt) generator. The
// generator always emits a default-deny profile with the dyld/mach baseline
// `(import "system.sb")`; these fields scope the allow-list on top of it.
message SandboxProfile {
  // backend selects the isolation backend (OS-version-gated; see DESIGN §5a).
  SandboxBackend backend = 1;

  // data_volume_path is the only path the pod may write (its APFS data volume);
  // typically the rootfs_path. Reads of /System, /usr, dyld cache, and the pod
  // dir are always granted by the baseline.
  string data_volume_path = 2;

  // extra_read_paths and extra_write_paths widen the allow-list for workloads
  // that need host paths beyond the baseline (e.g. hostPath volumes). Keep
  // minimal — every entry weakens isolation.
  repeated string extra_read_paths = 3;
  repeated string extra_write_paths = 4;

  // allow_network, when false, denies all network (default-deny). When true,
  // the runtime scopes network-bind/outbound to the pod IP.
  bool allow_network = 5;

  reserved 100 to 149; // M2: fine-grained mach-service / sysctl allow rules.
}

// SandboxBackend is the pod isolation mechanism. UNSPECIFIED means the runtime
// picks the best available for the host OS version.
enum SandboxBackend {
  SANDBOX_BACKEND_UNSPECIFIED = 0;
  // SEATBELT_EXEC shells out to sandbox-exec with a generated profile.
  SANDBOX_BACKEND_SEATBELT_EXEC = 1;
  // SEATBELT_INPROC applies the profile in-process via libsandbox (private SPI).
  SANDBOX_BACKEND_SEATBELT_INPROC = 2;
  // UIDJAIL is the uid-isolation fallback (no Seatbelt).
  SANDBOX_BACKEND_UIDJAIL = 3;
  // VM runs the pod in a Virtualization.framework micro-VM (untrusted tenancy).
  SANDBOX_BACKEND_VM = 4;
}

// ---------------------------------------------------------------------------
// Image manifest + signature policy (DESIGN §5a, image/rootfs).
// ---------------------------------------------------------------------------

// SignaturePolicy is the binary-signature gate enforced before exec.
// UNSPECIFIED is 0 and FAIL-CLOSED: a decoder that sees the zero value MUST
// treat it as "no policy specified" and refuse to run unverified code rather
// than silently allowing ad-hoc binaries.
enum SignaturePolicy {
  SIGNATURE_POLICY_UNSPECIFIED = 0;
  // ADHOC_OK permits unsigned binaries after ad-hoc signing (codesign -s - -f)
  // on pull — the dev default.
  SIGNATURE_POLICY_ADHOC_OK = 1;
  // REQUIRE_SIGNED requires a valid (any-authority) code signature.
  SIGNATURE_POLICY_REQUIRE_SIGNED = 2;
  // REQUIRE_NOTARIZED requires an Apple-notarized signature — the strictest.
  SIGNATURE_POLICY_REQUIRE_NOTARIZED = 3;
}

// ImageManifest describes an OCI image as an artifact: the config descriptor
// plus the ordered layer descriptors. Mirrors the OCI image-manifest shape so
// the runtime can pull → content-address → clonefile into the pod dir.
message ImageManifest {
  // reference is the pull reference (e.g. registry/repo:tag or @digest).
  string reference = 1;

  // media_type is the manifest media type
  // (application/vnd.oci.image.manifest.v1+json).
  string media_type = 2;

  // config is the image config descriptor.
  Descriptor config = 3;

  // layers are the layer descriptors in apply order.
  repeated Descriptor layers = 4;

  // annotations are arbitrary manifest annotations.
  map<string, string> annotations = 5;

  reserved 100 to 149; // M2: platform / subject (referrers) fields.
}

// Descriptor is an OCI content descriptor (media type, digest, size).
message Descriptor {
  // media_type is the descriptor's media type.
  string media_type = 1;

  // digest is the content digest, "<algo>:<hex>" (e.g. sha256:...).
  string digest = 2;

  // size is the content size in bytes.
  int64 size = 3;

  // urls are optional alternate download locations.
  repeated string urls = 4;

  // annotations are arbitrary descriptor annotations.
  map<string, string> annotations = 5;

  // platform, when set, constrains the descriptor to an OS/arch.
  Platform platform = 6;
}

// Platform is an OCI platform constraint (e.g. os=darwin, arch=arm64).
message Platform {
  string os = 1;
  string architecture = 2;
  string variant = 3;
  string os_version = 4;
}

// ---------------------------------------------------------------------------
// PodStatus — a LOSSLESS mirror of k8s.io/api/core/v1 PodStatus so kubectl Pod
// state never degrades crossing the runtime boundary.
// ---------------------------------------------------------------------------

// PodPhase mirrors corev1.PodPhase.
enum PodPhase {
  POD_PHASE_UNSPECIFIED = 0;
  POD_PHASE_PENDING = 1;
  POD_PHASE_RUNNING = 2;
  POD_PHASE_SUCCEEDED = 3;
  POD_PHASE_FAILED = 4;
  POD_PHASE_UNKNOWN = 5;
}

// ConditionStatus mirrors corev1.ConditionStatus (True/False/Unknown).
enum ConditionStatus {
  CONDITION_STATUS_UNSPECIFIED = 0;
  CONDITION_STATUS_TRUE = 1;
  CONDITION_STATUS_FALSE = 2;
  CONDITION_STATUS_UNKNOWN = 3;
}

// PodStatus is a lossless mirror of corev1.PodStatus for the fields the k3sm
// provider sets (and headroom for the rest). String type/reason/message fields
// are carried verbatim so the provider can round-trip them into corev1.
message PodStatus {
  // pod_id is the pod this status belongs to (the kube Pod UID).
  string pod_id = 1;

  // phase is the pod lifecycle phase.
  PodPhase phase = 2;

  // conditions are all pod conditions (Initialized, Ready, ContainersReady,
  // PodScheduled, …).
  repeated PodCondition conditions = 3;

  // message and reason are human/machine-readable status detail.
  string message = 4;
  string reason = 5;

  // host_ip / host_ips are the node IP(s).
  string host_ip = 6;
  repeated string host_ips = 7;

  // pod_ip / pod_ips are the pod IP(s); pod_ips[0] == pod_ip.
  string pod_ip = 8;
  repeated string pod_ips = 9;

  // start_time is when the kubelet acknowledged the pod (RFC3339).
  google.protobuf.Timestamp start_time = 10;

  // qos_class mirrors corev1 QOSClass ("Guaranteed"/"Burstable"/"BestEffort").
  string qos_class = 11;

  // nominated_node_name mirrors corev1 (scheduler preemption hint).
  string nominated_node_name = 12;

  // init_container_statuses and container_statuses carry per-container state.
  repeated ContainerStatus init_container_statuses = 13;
  repeated ContainerStatus container_statuses = 14;

  // ephemeral_container_statuses carries `kubectl debug` container state.
  repeated ContainerStatus ephemeral_container_statuses = 15;

  reserved 100 to 149; // M2: resourceClaimStatuses, resize, observedGeneration.
}

// PodCondition mirrors corev1.PodCondition.
message PodCondition {
  // type is the condition type ("Ready", "Initialized", …), carried verbatim.
  string type = 1;
  // status is True/False/Unknown.
  ConditionStatus status = 2;
  // last_probe_time / last_transition_time are RFC3339 timestamps.
  google.protobuf.Timestamp last_probe_time = 3;
  google.protobuf.Timestamp last_transition_time = 4;
  // reason and message explain the condition.
  string reason = 5;
  string message = 6;
}

// ContainerStatus mirrors corev1.ContainerStatus.
message ContainerStatus {
  // name is the container name.
  string name = 1;
  // state is the current state (running / terminated / waiting).
  ContainerState state = 2;
  // last_termination_state is the previous terminated state, if any.
  ContainerState last_termination_state = 3;
  // ready reflects readiness-probe success.
  bool ready = 4;
  // restart_count is the number of times the container has restarted.
  int32 restart_count = 5;
  // image and image_id identify the running image.
  string image = 6;
  string image_id = 7;
  // container_id is the runtime container id.
  string container_id = 8;
  // started reflects whether the startup probe has succeeded. Optional in
  // corev1 (*bool); started_set distinguishes false from unset.
  bool started = 9;
  bool started_set = 10;

  // volume_mounts is the status mirror of Container.volume_mounts (the
  // lossless-mirror pairing for the M2.1 spec field). Mirrors
  // corev1.ContainerStatus.VolumeMounts.
  repeated VolumeMountStatus volume_mounts = 11;

  // user is the effective uid/gid the privilege drop produced (the status
  // mirror of the resolved SecurityContext/PodSecurityContext). Mirrors
  // corev1.ContainerStatus.User.
  ContainerUser user = 12;

  // --- M2.2 resource mirror (allocated from ContainerStatus's reserved
  // 100..149 band — its reserved comment earmarked these) ---

  // resources is the effective compute ResourceRequirements (limits/requests)
  // for the container — the status mirror that completes the lossless corev1
  // mirror now that PodBox carries resource limits. Mirrors
  // corev1.ContainerStatus.Resources.
  ResourceRequirements resources = 100;

  // allocated_resources is the compute resources the node allocated to the
  // container at admission. Mirrors corev1.ContainerStatus.AllocatedResources.
  ResourceList allocated_resources = 101;

  // 100..101 allocated above; 102..149 stay reserved (149 ceiling preserved).
  reserved 102 to 149;
}

// VolumeMountStatus is the status mirror of a VolumeMount. Mirrors
// corev1.VolumeMountStatus (M2.1 subset: name, mountPath, readOnly).
message VolumeMountStatus {
  // name references the VolumeMount/PodBox.volumes name.
  string name = 1;
  // mount_path is the resolved mount path.
  string mount_path = 2;
  // read_only reflects the effective read-only state.
  bool read_only = 3;
}

// ContainerUser is the effective user the container runs as. Mirrors
// corev1.ContainerUser (M2.1 subset: the linux variant carries the resolved
// uid/gid/supplementalGroups — the effective identity after the privilege
// drop).
message ContainerUser {
  // linux is the resolved POSIX identity.
  LinuxContainerUser linux = 1;
}

// LinuxContainerUser is the resolved POSIX identity (effective uid/gid +
// supplemental groups) the privilege drop produced. Mirrors
// corev1.LinuxContainerUser.
message LinuxContainerUser {
  // uid is the effective user id.
  int64 uid = 1;
  // gid is the effective group id.
  int64 gid = 2;
  // supplemental_groups are the effective supplemental group ids (incl.
  // fs_group).
  repeated int64 supplemental_groups = 3;
}

// ContainerState mirrors corev1.ContainerState: exactly one of the three is
// set, matching the kube semantics (a pointer-per-state union).
message ContainerState {
  ContainerStateWaiting waiting = 1;
  ContainerStateRunning running = 2;
  ContainerStateTerminated terminated = 3;
}

// ContainerStateWaiting mirrors corev1.ContainerStateWaiting.
message ContainerStateWaiting {
  string reason = 1;
  string message = 2;
}

// ContainerStateRunning mirrors corev1.ContainerStateRunning.
message ContainerStateRunning {
  google.protobuf.Timestamp started_at = 1;
}

// ContainerStateTerminated mirrors corev1.ContainerStateTerminated.
message ContainerStateTerminated {
  int32 exit_code = 1;
  int32 signal = 2;
  string reason = 3;
  string message = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp finished_at = 6;
  string container_id = 7;
}

// ---------------------------------------------------------------------------
// Resource limits, QoS, and pod stats (M2.2) — the resource/metrics surface
// for the provider↔runtimed daemon split. PodBox carries the enforcement
// inputs (memory_limit_bytes / qos_class / rlimits); ContainerStatus mirrors
// the effective ResourceRequirements; PodStats/ContainerStats are the
// kubectl-top / kubelet-Summary-API snapshot the provider serves.
// ---------------------------------------------------------------------------

// QOSClass is a pod's resolved Quality-of-Service class. Mirrors corev1
// PodQOSClass. runtimed uses it for best-effort CPU scheduling policy (k3sm
// does not enforce CFS millicores — CPU is best-effort QoS only). UNSPECIFIED
// means the provider did not classify the pod (treat as BestEffort).
enum QOSClass {
  QOS_CLASS_UNSPECIFIED = 0;
  QOS_CLASS_GUARANTEED = 1;
  QOS_CLASS_BURSTABLE = 2;
  QOS_CLASS_BEST_EFFORT = 3;
}

// ResourceLimit is one POSIX resource limit runtimed applies via setrlimit(2)
// before spawning a container process. Modeled OCI-style (rlimits[]); type is
// the limit name carried verbatim (e.g. "RLIMIT_NOFILE", "RLIMIT_NPROC").
message ResourceLimit {
  // type is the rlimit name, e.g. "RLIMIT_NOFILE" or "RLIMIT_NPROC".
  string type = 1;
  // soft is the soft (enforced, raisable up to hard) limit.
  uint64 soft = 2;
  // hard is the hard (ceiling) limit.
  uint64 hard = 3;
}

// ResourceList mirrors corev1.ResourceList: a map from resource name (e.g.
// "cpu", "memory") to a resource.Quantity serialized as its canonical string
// (e.g. "500m", "1Gi"). Quantities are carried as strings so no precision is
// lost on the wire (resource.Quantity has no lossless proto scalar).
message ResourceList {
  // quantities maps a resource name to its canonical quantity string.
  map<string, string> quantities = 1;
}

// ResourceRequirements mirrors corev1.ResourceRequirements: the compute
// resource limits and requests for a container. k3sm enforces only memory (a
// hard limit → OOMKilled) and treats CPU as best-effort QoS (no CFS
// millicores); the full map is carried for lossless kubectl fidelity.
message ResourceRequirements {
  // limits is the maximum compute resources allowed.
  ResourceList limits = 1;
  // requests is the minimum compute resources required.
  ResourceList requests = 2;
}

// PodStats is a point-in-time resource-usage snapshot for one pod — the wire
// form of runtimed's pod-metrics sample, so the metric is a contract type and
// not an internal-only struct. The provider serves `kubectl top` / the kubelet
// Summary API from these. Mirrors the kubelet stats/v1alpha1 PodStats subset
// k3sm can source from proc_pid_rusage.
message PodStats {
  // pod_id is the pod (kube Pod UID) this sample is for.
  string pod_id = 1;
  // namespace and name are the kube coordinates (the Summary API PodReference).
  string namespace = 2;
  string name = 3;
  // timestamp is when the pod-level sample was taken.
  google.protobuf.Timestamp timestamp = 4;
  // cpu is the pod-level CPU usage (summed across containers).
  CPUStats cpu = 5;
  // memory is the pod-level memory usage (summed across containers).
  MemoryStats memory = 6;
  // containers are the per-container samples.
  repeated ContainerStats containers = 7;

  reserved 100 to 149; // M2.2+: network / ephemeral-storage / process stats.
}

// ContainerStats is a per-container resource-usage snapshot within PodStats.
// Mirrors the kubelet stats ContainerStats subset.
message ContainerStats {
  // name is the container name.
  string name = 1;
  // timestamp is when the container sample was taken.
  google.protobuf.Timestamp timestamp = 2;
  // cpu is the container CPU usage.
  CPUStats cpu = 3;
  // memory is the container memory usage.
  MemoryStats memory = 4;

  reserved 100 to 149; // M2.2+: rootfs / logs / accelerator stats.
}

// CPUStats is CPU usage at an instant. Mirrors the kubelet stats CPUStats
// subset. k3sm sources usage_core_nano_seconds from proc_pid_rusage
// (ri_user_time + ri_system_time); usage_nano_cores is the rate derived between
// two consecutive samples.
message CPUStats {
  // timestamp is when the CPU sample was taken.
  google.protobuf.Timestamp timestamp = 1;
  // usage_nano_cores is the recent CPU usage rate (nanocores; 1e9 == 1 core).
  uint64 usage_nano_cores = 2;
  // usage_core_nano_seconds is the cumulative CPU time consumed (nanoseconds).
  uint64 usage_core_nano_seconds = 3;
}

// MemoryStats is memory usage at an instant. Mirrors the kubelet stats
// MemoryStats subset. working_set_bytes is sourced from ri_phys_footprint
// (proc_pid_rusage) — NOT RSS — the same value runtimed:M2.2 compares against
// PodBox.memory_limit_bytes for OOMKilled.
message MemoryStats {
  // timestamp is when the memory sample was taken.
  google.protobuf.Timestamp timestamp = 1;
  // working_set_bytes is the working-set size (ri_phys_footprint) kubectl top
  // reports and OOMKilled is judged against.
  uint64 working_set_bytes = 2;
  // usage_bytes is total current memory usage.
  uint64 usage_bytes = 3;
  // rss_bytes is the resident set size, when available.
  uint64 rss_bytes = 4;
}

// ---------------------------------------------------------------------------
// RPC request/response messages.
// ---------------------------------------------------------------------------

// CreatePodRequest carries the PodBox to instantiate.
message CreatePodRequest {
  PodBox pod = 1;
  reserved 100 to 149;
}

// CreatePodResponse returns the initial status and a structured failure. status
// is OK on success; on failure error carries a google.rpc.Status (code +
// message + details) so the reason crosses the wire actionably, and
// failure_reason gives a typed, switchable cause.
message CreatePodResponse {
  PodStatus status = 1;
  google.rpc.Status error = 2;
  FailureReason failure_reason = 3;
  reserved 100 to 149;
}

// DeletePodRequest identifies the pod to delete.
message DeletePodRequest {
  string pod_id = 1;
  // grace_period_seconds is the SIGTERM→SIGKILL window; 0 means immediate kill.
  int64 grace_period_seconds = 2;
  reserved 100 to 149;
}

// DeletePodResponse returns a structured failure (empty on success).
message DeletePodResponse {
  google.rpc.Status error = 1;
  FailureReason failure_reason = 2;
  reserved 100 to 149;
}

// UpdatePodRequest carries the desired PodBox; the runtime applies what it can
// in place.
message UpdatePodRequest {
  PodBox pod = 1;
  reserved 100 to 149;
}

// UpdatePodResponse returns the resulting status and a structured failure.
message UpdatePodResponse {
  PodStatus status = 1;
  google.rpc.Status error = 2;
  FailureReason failure_reason = 3;
  reserved 100 to 149;
}

// WatchPodStatusRequest selects what to watch. pod_id empty = all pods on the
// node.
message WatchPodStatusRequest {
  string pod_id = 1;
}

// PodStatusEventType distinguishes adds/updates from deletes on the watch.
enum PodStatusEventType {
  POD_STATUS_EVENT_TYPE_UNSPECIFIED = 0;
  POD_STATUS_EVENT_TYPE_ADDED = 1;
  POD_STATUS_EVENT_TYPE_MODIFIED = 2;
  POD_STATUS_EVENT_TYPE_DELETED = 3;
}

// PodStatusEvent is one item on the WatchPodStatus stream.
message PodStatusEvent {
  PodStatusEventType type = 1;
  PodStatus status = 2;
}

// GetPodStatusRequest identifies the pod.
message GetPodStatusRequest {
  string pod_id = 1;
}

// GetPodStatusResponse returns the status (error set if the pod is unknown).
message GetPodStatusResponse {
  PodStatus status = 1;
  google.rpc.Status error = 2;
}

// GetLogsRequest selects a container's logs and the streaming options.
message GetLogsRequest {
  string pod_id = 1;
  string container = 2;
  // follow streams new lines as they are written (`kubectl logs -f`).
  bool follow = 3;
  // tail_lines, if > 0, starts from the last N lines.
  int64 tail_lines = 4;
  // since_time, if set, filters to entries at/after this time.
  google.protobuf.Timestamp since_time = 5;
  // timestamps prefixes each entry with its RFC3339 time.
  bool timestamps = 6;
  // previous returns logs from the previous terminated instance.
  bool previous = 7;
  // limit_bytes, if > 0, caps the bytes returned.
  int64 limit_bytes = 8;
}

// LogEntry is one chunk of container output on the GetLogs stream.
message LogEntry {
  // line is the raw bytes (may be a partial line for large writes).
  bytes line = 1;
  // timestamp is when the line was written.
  google.protobuf.Timestamp timestamp = 2;
  // stream identifies stdout vs stderr.
  LogStream stream = 3;
}

// LogStream identifies a container output stream.
enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
}

// ExecRequest frames a `kubectl exec`. The first message SHOULD set the exec
// parameters (pod_id, container, command, tty); subsequent messages carry
// stdin and resize events.
message ExecRequest {
  string pod_id = 1;
  string container = 2;
  repeated string command = 3;
  bool tty = 4;
  bool stdin = 5;
  bool stdout = 6;
  bool stderr = 7;
  // stdin_data carries input bytes for an already-started exec.
  bytes stdin_data = 8;
  // resize carries terminal size changes for a tty exec.
  TerminalSize resize = 9;
}

// ExecResponse streams a container exec's output and final exit code.
message ExecResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  // exit, when set, is the terminal result; the server closes the stream after.
  ExecResult exit = 3;
}

// ExecResult is the terminal outcome of an exec.
message ExecResult {
  int32 exit_code = 1;
  google.rpc.Status error = 2;
}

// AttachRequest frames a `kubectl attach`.
message AttachRequest {
  string pod_id = 1;
  string container = 2;
  bool stdin = 3;
  bool stdout = 4;
  bool stderr = 5;
  bool tty = 6;
  bytes stdin_data = 7;
  TerminalSize resize = 8;
}

// AttachResponse streams attach output.
message AttachResponse {
  bytes stdout = 1;
  bytes stderr = 2;
  ExecResult exit = 3;
}

// PortForwardRequest frames a `kubectl port-forward` payload: bytes destined
// for a pod port on a logical connection.
message PortForwardRequest {
  string pod_id = 1;
  // port is the pod-side TCP port.
  int32 port = 2;
  // connection_id multiplexes multiple forwarded connections on one stream.
  uint64 connection_id = 3;
  // data is the forwarded bytes.
  bytes data = 4;
  // close signals the connection should be half/fully closed.
  bool close = 5;
}

// PortForwardResponse streams bytes from the pod back to the client.
message PortForwardResponse {
  uint64 connection_id = 1;
  bytes data = 2;
  bool close = 3;
  google.rpc.Status error = 4;
}

// TerminalSize is a tty window size.
message TerminalSize {
  uint32 width = 1;
  uint32 height = 2;
}

// GetRuntimeInfoRequest is empty (reserved for future filters).
message GetRuntimeInfoRequest {}

// GetRuntimeInfoResponse reports the daemon version + health for the M2 process
// split's version-compat handshake.
message GetRuntimeInfoResponse {
  // runtime_name is the implementation name (e.g. "k3sm-runtimed").
  string runtime_name = 1;
  // runtime_version is the daemon's semantic version.
  string runtime_version = 2;
  // api_version is the runtime/v1 contract version this daemon speaks.
  string api_version = 3;
  // healthy is the overall readiness; conditions detail subsystems.
  bool healthy = 4;
  repeated RuntimeCondition conditions = 5;
  reserved 100 to 149; // M2: backend capabilities, OS version, feature flags.
}

// RuntimeCondition is a single daemon subsystem health signal.
message RuntimeCondition {
  string type = 1;
  ConditionStatus status = 2;
  string reason = 3;
  string message = 4;
}

// ListPodStatsRequest selects which pods to sample. pod_id empty = all pods on
// the node (the Summary API shape); pod_id set = that single pod.
message ListPodStatsRequest {
  string pod_id = 1;
}

// ListPodStatsResponse carries the per-pod resource-usage snapshots.
message ListPodStatsResponse {
  repeated PodStats pod_stats = 1;
}

// RestartContainerRequest identifies the container to restart in place.
message RestartContainerRequest {
  // pod_id is the pod whose container to restart.
  string pod_id = 1;
  // container is the container name within the pod.
  string container = 2;
  // reason is a human-readable cause (e.g. "liveness probe failed") recorded in
  // the container's last-termination state.
  string reason = 3;
  // grace_period_seconds is the SIGTERM→SIGKILL window for the old process
  // before re-spawn; 0 means the runtime default.
  int64 grace_period_seconds = 4;
  reserved 100 to 149;
}

// RestartContainerResponse returns the post-restart container status and a
// structured failure (empty error on success).
message RestartContainerResponse {
  // status is the container's status after the restart (restart_count bumped).
  ContainerStatus status = 1;
  // error carries a structured failure (e.g. NOT_FOUND for an unknown pod or
  // container).
  google.rpc.Status error = 2;
  // failure_reason gives a typed, switchable cause.
  FailureReason failure_reason = 3;
  reserved 100 to 149;
}

// FailureReason is a typed, switchable cause for a failed pod operation,
// complementing the google.rpc.Status detail. UNSPECIFIED means "no typed
// reason" (consult the rpc.Status).
enum FailureReason {
  FAILURE_REASON_UNSPECIFIED = 0;
  // INVALID_POD_BOX: the PodBox failed validation (missing id, rootfs, …).
  FAILURE_REASON_INVALID_POD_BOX = 1;
  // IMAGE_PULL: the image could not be pulled.
  FAILURE_REASON_IMAGE_PULL = 2;
  // SIGNATURE_REJECTED: a binary failed the SignaturePolicy gate.
  FAILURE_REASON_SIGNATURE_REJECTED = 3;
  // SANDBOX_SETUP: the Seatbelt profile failed to compile/apply.
  FAILURE_REASON_SANDBOX_SETUP = 4;
  // ROOTFS_SETUP: materializing the rootfs (clonefile) failed.
  FAILURE_REASON_ROOTFS_SETUP = 5;
  // SPAWN: posix_spawn of a container process failed.
  FAILURE_REASON_SPAWN = 6;
  // NOT_FOUND: the referenced pod does not exist.
  FAILURE_REASON_NOT_FOUND = 7;
  // ALREADY_EXISTS: the pod id is already live.
  FAILURE_REASON_ALREADY_EXISTS = 8;
  // NOT_UPDATABLE: an UpdatePod touched a field that requires recreate.
  FAILURE_REASON_NOT_UPDATABLE = 9;
  // RESOURCE_EXHAUSTED: the node lacks capacity (uid/IP/fd) to admit the pod.
  FAILURE_REASON_RESOURCE_EXHAUSTED = 10;
  // INTERNAL: an unexpected runtime error.
  FAILURE_REASON_INTERNAL = 11;
}
